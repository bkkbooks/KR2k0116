body:
  text: 嶺外代答卷六宋周去非撰器用門舟楫附端硯余屢過端溪必登硯巖論之詳矣石品不一大槩有三曰巖石曰坑石曰黃步石巖上也坑次也黃步其下也凡此皆三品之佳者論之耳若其不佳等為棄物不足論也黃步粗而有紋善柱墨亦善敗筆正可作良砥非文房中所寶坑石有二南坑新坑南坑石眼青暗新坑石眼中有朱點而亦暗然皆體硬叩之鏗然雖細潤久則不宜於墨忽得一至潤良材乃復大竒雖巖硯無以遠過巖石有三上巖中巖下巖髙在山之胸乳間曰上巖深入至與平地等曰中巖深入至水府曰下巖上巖石理燥渴中巖溫潤宜人嵗久亦滑墨至於下巖則竒絶一世石理如玉望之似藴德君子循之則溜滑滋潤欲識其真要不可言傳也若夫山心石根韜藏深潤其大如斗中有子石宜筆宜墨百年不枯蓋世之寶在是三巖者雖有三竅而中則相通其實以髙下定石之等耳人之深入也自竅口疊朩為小級道委地曲折入于黃泉以數百人髙下排比以大竹筒傳水以乾其洞然後續膏燭幽而施錐鑿其得之也可以為難矣是宜寶之筆廣西多閹雞羽毛甚澤人取其頸毛絲而聚之以為筆全類兔毫一枝直四五錢然毫短鋒齊軟而無力止宜細書茍字大半寸難書矣嶺外亦有兔其毫乃不堪為筆靜江府羊毫筆則絶佳蓋馳聲於深廣也墨容州多大松其人能製墨佳者一笏不盈百錢其下則一斤止直錢二百商人舉數則搭賣之交址墨雖不甚佳亦不至甚腐交人以墨與角硯筆併垂腰間茶具雷州鐵工甚巧製茶碾湯甌湯匱之屬皆若鑄就余以比之建寧所出不能相上下也夫建寧名茶所出俗亦雅尚無不善分茶者雷州方啜䔲茶奚以茶器為哉螺杯南海出大螺南人以為酒杯螺之類不一有哆口而圓長者曰螺杯有濶而淺形如荷葉者則曰瀲灔杯有剖半螺色紅潤者曰紅螺杯有形似鸚鵡之睡朱喙緑首者曰鸚鵡杯羽扇靜江人善捕飛禽即以其羽為扇凡扇必左羽取羽張之以線索繫住俟肉乾筋定乃可用鷲大禽也以其羽為扇長數尺黑色多風勇士用之頗壯觀鷺羽潔白輕質而風細士夫多用之以膠漆塗其筋骨而丹之頗亦雅尚交址人又用鶴羽以線編比羽管而别施柄其説謂交址地多蛇鶴能食蛇蛇聞鶴羽之氣必遠避之用鶴以却蛇也蠻刀猺人刀及黎刀略相類皆短刃而長靶黎刀之刃尤短以斑藤織花纒束其靶以白角片尺許如鷂尾飾靶之首猺刀雖無文飾然亦銛甚左右江洞與界外諸蠻刀相類刃長四尺而靶二尺一鞘而中藏二刀蓋一大一小焉靶之端為雙圓而相並洞刀以黑皮為鞘黑漆飾靶黑皮為帶蠻刀以褐皮為鞘金銀絲飾靶朱皮為帶洞刀以凍州所作為佳蠻刀以大理所出為佳猺刀黎刀帶之於腰洞刀蠻刀佩之於肩洞人蠻人寧以大刀贈人其小刀必不與人蓋其日用須臾不可闕忽遇藥箭急以刀剜去其肉乃不死以故不以與人今世所謂吹毛透風乃大理刀之類蓋大理國有麗水故能製良刀云蠻甲胄諸蠻甲胄皆以皮為之猺人以熊皮為甲胄其土有朩葉似漆以之塗飾亦復堅善猺人之剽掠介胄者止數人以為前行其餘悉袒裼亦足見其易與矣而靜江鄉民未嘗有甲所以望風而遁其間一二團聚有皮甲者猺人亦且避之自猺人而西南如南丹州雍州左右江洞溪至於外夷則甲胄盛矣諸蠻唯大理甲胄以象皮為之黑漆堅厚復問以朱縷如中州之犀毗器皿又以小白貝綴其縫此豈詩所謂貝胄朱綅者耶大理國之製前後掩心以大片象皮如龜殼其披膊以中片皮相次為之其護項以全片皮捲圈成之其他則小片如中國之馬甲葉皆堅與鐵等而厚幾半寸茍試之以弓矢將不可徹鐵甲殆不及也蠻鞍蠻人馬鞍與中國鞍不相遠但不用韉唯有橋鐙貼腿耳橋朱黑相漆如犀毗紋鐙如半靴藏足指其中蓋猺人路險馬行荆棘懼傷足也貼腿以皮包下亦用氊以傅馬脊後鞦鏇朩為大錢數十枚珠貫而繫之如騾驢然鞍皆大宜於馬脊但前橋差低耳蠻弩凡蠻猺之弩狀如中都之吃笪弩蓋不能彎弓而皆能踏弩也以燕脂朩為之長六尺餘厚二寸博四寸許其長三尺餘厚止半寸不劃箭槽編架其箭于栝故名曰編架弩其箭剡竹為之或用小圓竹而皆有弩之箭戶鏃如鑿或如鳬茨葉以軟皮為羽利于射髙而不可以俯射則弓易軟矢易鉤非良材也宜州南丹等及雍州左右江之諸洞西南舊弩其製作略同其弓材則良矣唯南丹弩弓材為絶佳蓋南丹弩弓其材有五加朩上也石朩次也黃速櫑又其次也燕脂朩為下矣加朩射愈近而激矢愈遠無末約之弊故名曰加石朩膚理沉黑堅類鐡石黃速櫑發矢聲鏗然也視燕脂朩則力同而矢遠倍之矣余嘗聞吃笪小弩之利材之良與夫抹弦掇弦擫矢撅矢之技頗臻乎巧及聞靜江猺人弩徑甚矢無空發古縣之民一聞虛弦之聲率皆奔潰因見蠻弩即吃笪之大者耳融劒梧州生鐵最良藤州有黃岡鐵最易融州人以梧鐵淋銅以黃岡鐵夾盤煆之遂成松文刷絲工飾其製劒亦頗銛然終不可以為良黎弓諸猺皆以弩為長技唯南黎人以弓為長技黎弓以朩亦或以竹而弦之以藤類中州彈弓其矢之大其鏃也故雖無羽亦可施之於射近大抵黎弓正與倭弓相類但倭弓長大而黎弓短小耳倭弓長丈許據弓下梢於地平身射之手空矢長能以無羽之矢命中於百步之外黎人弓短矢重往者黎人跳梁官軍以竹弓禦之矢不能斃人大為黎人所輕彼特未遇吾徑弓耳然南方卑濕角弓易壞惟竹弓可用不徑也固宜若蠻洞之速櫑朩加朩石朩天下之良材也誠得是朩製以為弓雖角弓之徑有不能當者雖用以威天下可也藥箭溪洞弩箭皆有藥唯南丹為最酷南丹地産毒虺其種不一人乃合集醖釀以成藥以之傅矢藏之竹筒矢鏃皆重縮是矢也度必中而後發茍中血縷必死唯其土人自有解藥南丹之戰也人以甘蔗一節自隨忽爾中矢即噉蔗則毒氣為之少緩急歸繫身於朩株而服解藥少焉毒作身將奮擲於朩株繫身得不擲死否則藥作而自躍於虛空隕地撲殺耳雍州溪洞以桄榔朩為箭鏃桄榔遇血悉裂故其矢亦能害人梧州鐵器梧州生鐵在鎔則如流水然以之鑄器則薄幾類紙無穿破凡器既輕且耐久諸郡鐵工煆銅得梧鐵雜淋之則為至剛信天下之美材也朩蘭舟浮南海而南舟如巨室帆若垂天之雲柂長數尺一舟數百人中積一年糧豢豕釀酒其中置死生於度外徑入阻碧非復人世人在其中日擊牲酣飲迭為賔主以忘其危舟師以海上隱隱有山辨諸蕃國皆在空端若曰往某國順風幾日望某山舟當轉行某方或遇急風雖未足日已見某山亦當改方苟舟行太過無方可返飄至淺處而遇暗石則當瓦解矣蓋其舟大載重不憂巨浪而憂淺水也又大食國更越西海至朩蘭皮國則其舟又加大矣一舟容千人舟上有機杼市井或不遇便風則數年而後達非甚巨舟不可至也今世所謂朩蘭舟未必不以至大言也藤舟深廣沿海州軍難得鐵釘桐油造舟皆空板穿藤約束而成於藤縫中以海上所生茜草乾而室之遇水則漲舟為之不漏矣其舟甚大越大海商販皆用之而或謂要過磁石山而然未之詳爾今蜀舟底以柘朩為釘蓋其江多石不可用鐵釘而亦謂蜀江有磁石山得非傳聞之誤刳朩舟廣西江行小舟皆刳朩為之有面濶六七尺者雖全成無罅免繻袽之勞釘灰之費然質厚遲鈍忽遇大風浪則不能翔多至沉溺要不若板船雖善不能為矣欽州競渡獸舟亦刳全朩為之則其地之所産可知矣海外蕃船亦有刳朩者則其為朩何止合抱而巳哉柂欽州海山有竒材二種一曰紫荆朩堅類鐵石色比燕脂易直合抱以為棟梁可數百年一曰烏婪木用以為大船之柂極天下之妙也蕃舶大如廣厦深涉南海徑數萬里千百人之命直寄于一柂他産之柂長不過三丈以之持萬斛之舟猶可勝其任以之持數萬斛之蕃舶卒遇大雨于深海未有不中折者唯欽産縝理堅密長幾五丈雖有惡風怒濤截然不動如以一絲引千鈞於山嶽震頺之地真凌波之至寶也此柂一雙在欽直錢數百緡至番禺溫陵價十倍矣然得至其地者亦十之一二以材長甚難海運故耳蠻笠西南蠻笠以竹為身而冒以魚氊其頂尖圓髙起尺餘而四圍頗下垂視他蕃笠其製似不佳然最宜乘馬蓋頂髙則定而不傾四垂則風不能揚他蕃笠所不及也交址有笠如兜鍪而頂偏似田螺之臀謂之螺笠以細竹縷織成雖曰工巧特賤夫之所戴爾皮履交址人足躡皮履正是今畫羅漢所躡者以皮為底而中施一小柱長寸許上有骨朵頭以足將指夾之而行或以紅皮如十字倒置其三頭於皮底之上以足穿之而行皆燕居之所履也地近西方則其服飾已似之矣服用門緂雍州左右江洞蠻有織白緂白質方紋廣幅大縷似中都之線羅而佳麗厚重誠南方之上服也布廣西觸處富有苧麻觸處善織布柳布象布商人貿遷而聞于四方者也靜江府古縣民間織布擊軸於腰而織之其欲他幹則軸而行意其必踈數不均且甚慢矣及買以日用乃復甚佳視他布最耐久但其幅狹耳原其所以然蓋以稻穰心燒灰煮布縷而以滑石粉膏之行梭滑而布以緊也猺斑布猺人以藍染布為斑其紋極細其法以木板二片鏤成細花用以夾布而鎔蠟灌于鏤中而後乃釋板取布投諸藍中布既受藍則煮布以去其蠟故能受成極細斑花炳然可觀故夫染斑之法莫猺人若也水細廣西亦有桑蠶但不多耳得繭不能為絲煮之以灰水中引以成縷以之織細其色雖暗而特宜於衣在髙州所産為佳綀子雍州左右江溪洞地産苧麻潔白細薄而長土人擇其尤細長者為綀子暑衣之輕涼離汗者也漢髙祖有天下令賈人無得衣綀則其可貴自漢而然有花紋者為花綀一端長四丈餘而重止數十錢捲而入之小竹筒尚有餘地以染真紅尤易著色厥價不廉稍細者一端十餘緡也安南絹安南使者至欽太守用妓樂宴之亦有贈於諸妓人以絹一匹絹粗如細網而蒙之以綿交人所自著衣裳皆密絹也不知安南如網之絹何所用也余聞蠻人得中國紅絁子皆拆取色絲而自以織衫此絹正宜拆取其絲耳氊西南蠻地産綿羊固宜多氊毳自蠻王而下至小蠻無一不披氊者但蠻王中錦衫披氊小蠻袒裼披氊爾北氊厚而堅南氊之長至三丈餘其濶亦一丈六七尺摺其濶而夾縫之猶濶八九尺許以一長氊帶貫其摺處乃披氊而繫帶於腰婆娑然也晝則披夜則卧雨晴寒暑未始離身其上有核桃紋長大而輕者為妙大理國所産也佳者緣以皂吉貝吉貝木如低小桑枝蕚類芙蓉花之心葉皆細茸絮長半寸許宛如柳綿有黑子數十南人取其茸絮以鐵筯碾去其子即以手握茸就紡不煩緝績以之為布最為堅善唐史以為古貝又以為草屬顧古吉字訛草木物異不知别有草生之古貝非木生之吉貝耶將微朩似草字畫以疑傳疑耶雷化廉州及南海黎洞富有以代絲紵雷化廉州有織匹幅長濶而潔白細密者名曰慢吉貝狹幅粗踈而色暗者名曰粗吉貝有絶細而輕軟潔白服之且耐久者海南所織則多品矣幅極濶不成端匹聯二幅可為卧單名曰黎單間以五采異紋炳然聯四幅可以為幕者名曰黎飾五色鮮明可以蓋文書几案者名曰鞍搭其長者黎人用以繚腰南詔所織尤精好白色者朝霞也國王服白㲲王妻服朝霞唐史所謂白㲲吉貝朝霞吉貝是也蟲絲廣西楓葉初生上多食葉之蟲似蠶而赤黑色四月五月蟲腹明如蠶之熟橫州人取之以釅醋浸而擘取其絲就醋中引之一蟲可得絲長六七尺光明如煮成弓琴之弦以之繫弓刀紈扇固且佳婆衫婆裙欽州村落土人新婦之飾以碎雜綵合成細毬文如大方帕各衫左右兩箇縫成袖口披著以為上服其長止及腰婆娑然也謂之婆衫其裙四圍縫製其長丈餘穿之以足而繫於腰間以藤束腰抽其裙令短聚所抽於腰則腰特大矣謂之婆裙頭頂藤笠裝以百花鳳為新婦服之一月雖出入村落虛市亦不釋之食用門酒廣右無酒禁公私皆有美醖以帥司瑞露為冠風味藴藉似備道全美之君子聲震湖廣此酒本出賀州今臨賀酒乃遠不逮諸郡酒皆無足稱昭州酒頗能醉人聞其造酒時採曼陀羅花置之甕面使酒收其毒氣此何理耶賔橫之間有古辣墟山出藤藥而水亦宜釀故酒色微紅雖以行烈日中數日其色味宛然若醇厚則不足也諸郡富民多醖老酒可經十年其色深沉赤黑而味不壞諸處道旁率沽白酒在靜江尤盛行人以十四錢買一大白及豆腐羮謂之豆腐酒靜江所以能造鉛粉者以糟邱之富也茶靜江府修仁縣産茶土人製為方銙方二寸許而差厚有供神仙三字者上也方五六寸而差薄者次也大而粗且薄者下矣修仁其名乃甚彰煮而飲之其色慘黑其味嚴重能愈頭風古縣亦産茶味與修仁不殊食檳榔自福建下四川與廣東西路皆食檳榔者客至不設茶唯以檳榔為禮其法斫而瓜分之水調蜆灰一銖許于蔞葉上裹檳榔咀嚼先吐赤水一口而後噉其餘汁少焉面臉潮紅故詩人有醉檳榔之句無蜆灰處只用石灰無蔞葉處只用蔞藤廣州又加丁香桂花三賴子諸香藥謂之香藥檳榔唯廣州為甚不以貧富長幼男女自朝至暮寧不食飯唯嗜檳榔富者以銀為盤置之貧者以錫為之晝則就盤更噉夜則置盤枕旁覺即噉之中下細民一家日費檳榔錢百餘有嘲廣人曰路上行人口似羊言以蔞葉雜咀終日噍飼也曲盡噉檳榔之狀矣每逢人則黑齒朱唇數人聚會則朱殷遍地實可厭惡客次士夫常以自隨製如銀鋌中分為三一以盛蔞一盛蜆灰一則檳榔交址使者亦食之詢之於人何為酷嗜如此答曰辟瘴下氣消食食久頃刻不可無之無則口舌無味氣乃穢濁嘗與一醫論其故曰檳榔能降氣亦能耗氣肺為氣府居膈上為華蓋以掩腹中之穢久食檳榔則肺縮不能掩故穢氣升聞于輔頰之間常欲噉檳榔以降氣實無益於瘴彼病瘴紛然非不食檳榔也老鮓南人以魚為鮓有十年不壞者其法以及鹽麵雜漬盛之以甕甕口周為水池覆之以碗封之以水水耗則續如是故不透風鮓數年生白花似損壞者凡親戚贈遺悉用酒鮓唯以老鮓為至愛異味深廣及溪洞人不問鳥獸蛇蟲無不食之其間異味有好有醜山有鱉名竹有鼠名𪕋鶬鸛之足臘而煮之鱘魚之唇活而臠之謂之魚魂此其至珍者也至於遇蛇必捕不問短長遇鼠必執不别小大蝙蝠之可惡蛤蚧之可畏蝗蟲之微生悉取而燎食之蜂房之毒麻蟲之穢悉炒而食之蝗蟲之卵天蝦之翼悉鮓而食之此與甘帶嗜薦何異哉甚者則煮羊胃混不潔以為羮名曰青羮以試賔客之心客能忍食則大喜不食則以為多猜抑不知賔主之間果誰猜耶顧乃鮓鶯哥而臘孔雀矣齋素欽人親死不食魚肉而食螃蟹車螯蠔螺之屬謂之齋素以其無血也海南黎人親死不食粥飯唯飲酒食生牛肉以為至孝在是買水沽水欽人始死孝子披髮頂竹笠攜瓶甕持紙錢往水濵號慟擲錢于水而汲歸浴尸謂之買水否則鄰里以為不孝今欽人日用以錢易水以充庖厨謂之沽水者避凶名也雍州溪洞則男女羣浴于川號泣而歸
