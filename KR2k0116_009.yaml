body:
  text: 嶺外代答卷九宋周去非撰禽獸門象交址山中有石室唯一路可入周圍皆石壁交人先置芻豆于中驅一雌馴象入焉乃布甘蔗于道以誘野象象來食蔗則縱馴雌入野象羣誘之以歸既入因以巨石窒其門野象飢甚人乃緣石壁飼馴雌野象見雌得飼始雖畏之終亦狎而求飼益狎人乃鞭之以箠少馴則乘而制之凡制象必以鈎交人之馴象也正跨其頸手執鐵鈎以鈎其頭欲象左鈎頭右欲右鈎左欲却鈎額欲前不鈎欲象跪伏以鈎正案其腦復重案之痛而號鳴人見其號也遂以為象能聲喏焉人見其羣立而行列齊也不知其有鈎以前却左右之也蓋象之為獸也形雖大而不勝痛故人得以數寸之鈎馴之久久亦解人意見乘象者來低頭跪膝人登其頸則奮而起行象頭不可俯頸不可回口隱於頥去地猶逺其飲食運動一以鼻為用鼻端深大可以開闔其中又有小肉夾雖芥子亦可拾也每以鼻取食即就爪甲擊去泥垢而後捲以入口其飲水亦以鼻吸而捲納諸口村落小民新篘熟野象逐香而來以鼻破壁而入飲人之大患也象足如柱無指而有爪甲登髙山下峻阪渡深水其形擁腫而乃捷甚交人呼而驅之似能與之言者貢象之役一象不甚馴未幾病死呻吟數日將死回首指南而斃其能正邱首如此是亦非凡獸也欽州境內亦有之象行必有熟路人於路傍木上施機刃下屬于地象行觸機機刃下擊其身茍中其要害必死將死以牙觸石折之知牙之為身災也茍非要害則負刃而行肉潰刃脫乃已非其要害而傷其鼻者亦死蓋其日用無非鼻傷之則療不可合能致死也亦有設陷穽殺之者去熟路丈餘側斜攻土以為穽使路如舊而象行不疑乃墮穽中世傳象能先知地之虛實非也第所經行必無虛土耳象目細畏火象羣所在最害禾稼人倉卒不能刺以長竹繫火逐之乃退象能害人羣象雖多不足畏惟可畏者獨象也不容於羣故獨行無畏遇人必肆其毒以鼻捲人擲殺則以足蹙人血透肌而以鼻吸飲人血人殺一象衆飽其肉惟鼻肉最美爛而納諸糟邱片腐之食物之一雋也象皮可以為甲堅甚人或條截其皮硾直而乾之治以為杖至堅善云虎虎廣中州縣多有之而市有虎欽州之常也城外水壕往往虎穴其間時出為人害村落則晝夜羣行不以為異余始至欽已見城北門衆逐虎頗訝之未幾白事提學司投宿寧越驛亭中率是虎迹余怪而問焉答曰吾與妻子卧壁下虎夜掉尾擊吾壁以鼻嗅人氣垂涎不去比還欽時雨潦壞城虎入城負大豕無虛夕因玩狎不復驚忽有虎晚入安逺縣衙坐戒石前守宿吏卒不以為意直相與揶揄之少焉緩步陟廳吏卒始散乃知虎也天馬雍州溪洞七源州有天馬山山上有野馬十餘匹疾迅若飛人不能邇熙寧間七源知州縱牝馬于山後生駒駿甚自後屢縱迄不可得矣蠻馬南方諸蠻馬皆出大理國羅殿自杞特磨嵗以馬來皆販之大理者也龍羅張石方五部蕃族謂之淺蕃亦産馬馬乃大口項軟趾髙真駑駘爾唯地愈西北則馬愈良南馬狂逸奔突難於駕馭軍中謂之拚命擡一再馳逐則流汗被體不如北馬之耐然忽得一良者則北馬雖壯不可及也此豈西域之遺種也耶是馬也一匹直黃金數十兩茍有必為洞官所買官不可得矣蠻人所自乘謂之座馬往返萬里跬步必騎駝負且重未嘗困乏蠻人寧死不以此馬豫人蓋一無此馬則不可返國所謂真堪託死生者聞南詔越睒之西産善馬日馳數百里世稱越睒駿者蠻人座馬之類也聞今溪洞有一黃淡色馬髙止四尺餘其耳如人指之小其目如垂鈴之大鞍轡將來體起拳筋一動其韁倐忽若飛跳墻越塹在乎一喝此馬本蠻王騎來偶病黃洞官以黃金百兩買而醫之後蠻王再來見之嘆息欲以金二百兩買去勿豫之矣嘗有一勢力者欲強取之洞官鑿裂其蹄然不害於行也此馬希世之遇何止來十一於千萬哉謂可必得害事多矣果下馬果下馬土産小駟也以出德慶之瀧水者為最髙不踰三尺駿者有兩脊骨故又號雙脊馬健而善行又能辛苦瀧水人多孶牧嵗七月十五日則盡出其所蓄會江上馳騁角逐買者悉來聚觀會畢即議價交易它日則難得矣湖南邵陽營道等處亦出一種低馬短項如豬駑鈍不及瀧水兼亦稀有雙脊者蠻犬蠻犬如獵狗警而猘諸蠻以馬互市於橫山皆作茅舍野次謂之茅寮率攜一犬以自防盜莫敢近猿猿有三種金線者黃玉面者黑純黑者面亦黑金線玉面皆難得或云純黑者雄金線者雌又云雄能嘯雌不能也子能抱持其母牢不可拆人取之射殺其母取其子子猶抱母皮不釋獵猿者可以戒也猿性不耐著地著地輒㵼以死煎附子汁與之即止登木好以兩臂攀枝上不甚用足終日纍纍然白鹿欽州平野多鹿中有一鹿大軀長角玉雪其色嘗墮蘇氏網羅幾擒而逸淳熙乙未二月有野婦把一白麛鬻於市太守鄭以錢七百得之日取生牛乳飼之長大乃雌爾然馴狎可愛鄭求得張曲江進白鹿故事作纍金羈絡掩尾之飾將以進呈而不遂然欽之白鹿自昔有之不足異也南方野鹿成羣望人不去近逼之而後走性癡畏聞人氣人在上風其走必速下風則走遲獵者從下風逼射之蜼深廣山中有獸似豹常仰視天雨則以尾窒鼻南人呼為倒鼻鱉捕得則寢處其皮士夫珍之以藉胡牀今冕服所畫蜼是也夫獸能以尾窒鼻禦雨斯亦智矣其登於三代之服章厥有由哉人熊廣西有獸名人熊乃一長大人也被髮裸體手爪長鋭常以爪劃橄欖木取其脂液塗身厚數寸用以禦寒暑敵搏噬是獸也力能搏虎每踸踔而行道遇一木根必拔去而後行登木而食橡栗必折盡而後巳余夜宿昭州灘下聞山中拔木聲舟師急移舟宿逺岸問之曰人熊在山能即船害人又云往年融州有人熊渡水人以為獸也拏舟刺之以鎗熊就水接鎗折之遂破人舟其在山中遇人則執人手以舌掩靣而笑少焉以爪抉人目睛而去嘗有人熊日坐于猺人之門猺人每投以飯因起機心以大木兩片緊合之中椓一杙令兩木中開次日人熊至見杙而怒跨坐拔去杙而兩木合正害其勢乃死猺人急去木以米泔洗地繼而雌至求雄莫辨所殺之處遂不為害不然雖猺人亦不可得而安居矣山豬山豬即毫豬身有棘刺能振發以射人三二百為羣以害苗稼州洞中甚苦之花羊花羊南中無白羊多黃褐白斑如黃牛又有一種深褐黑脊白斑全似鹿羣放山谷望之真鹿也肴饌中羊皮率青黯可憎以無白羊故也綿羊綿羊出雍州溪洞及諸蠻國與朔方胡羊不異有白黑二色毛如繭纊剪毛作氊尤勝朔方所出者大狸凡狸之類不一多有穴於城郭園林者其大倍貓身有黑點鳴號洶厲處處有之雍别有一種大狸其毛色如金錢豹但其錢差大耳彼人云嵗久則為豹其文先似之矣此皮可以寢及覆胡牀其大幾及豹也風狸風狸狀如黃猿食蜘蛛書則拳曲如蝟遇風則飛行空中其溺及乳汁主治風疾竒效有野夫籠一枚詣賔守劉仔任道晝伏不動夜則奔躍於籠中不休需錢五十千劉笑郤之仰鼠欽州有鼠形如豬黑身白腹仰生土中攻土而行逆順前却迅疾難捕人見土面迤邐墳起即知其為鼠急以钁斷其前後夾掘而擒之不然一聞钁聲退而逝矣香鼠香鼠至小僅如指擘大穴於柱中行地上疾如激箭官舍中極多石鼠石鼠專食山豆根賔州人捕得以其腹乾之治咽喉疾效如神功用勝山豆根謂之石鼠肚麝香自雍州溪洞來者名土麝氣臊烈不及西香然比年西香多偽雜一臍化為十數枚豈復有香南麝氣味雖劣以不多得得為珍貨不暇作偽入藥宜有力懶婦懶婦世傳織婦慵懶者所化狀如山豬而小喜食禾苗田夫以機軸織絍之器挂田所則不復近安平七源等州有之山獺山獺出宜州溪洞俗傳為補助要藥洞人云獺性淫毒山中有此物凡牝獸悉避去獺無偶抱木而枯洞獠尤貴重云能解藥箭毒中箭者研其骨少許傅治立消一枚直金一兩人或來買但得殺死者功力甚劣抱木枯者土人自稀得之徒有其説而已山鳯凰鳯凰生丹穴丹穴南方也今雍州溪洞髙崖之上人迹不至之處乃有鳯凰巢焉五色成章大逾孔雀如今所畫而頭特大百鳥遇之必環列而立其頂之冠常盛水雌雄更飲未始下人間南人謂之山鳯凰石湖虞衡志云兩江深林有卵雄者以木枝雜桃膠封其雌于巢獨留一竅雄飛來食以飼之子成即發封不成窒竅殺之此亦暴物孔雀孔雀世所常見者中州人得一則貯之金屋南方乃臘而食之物之賤于所産者如此膽能殺人以膽一滴霑于酒盞之臀而酌以飲人亦死前志謂南方有大雀五色成文為鸞凰之屬孔者大也豈是物與鸚鵡占城産五色鸚鵡唐太宗時環王所獻是也案傳謂能訴寒有詔還之環王國即占城也余在欽嘗于聶守見白鸚鵡紅鸚鵡白鸚鵡大如小鵝羽毛有粉如蝴蝶翅紅鸚鵡其色正紅尾如烏鳶之尾然皆不能言徒有其表爾欽州富有鸚哥頗慧易教土人不復雅好唯福建人在欽者時或教之歌詩乃真成閩音此禽南州羣飛如野鳥舉網掩羣臠以為鮓物之不幸如此烏鳯烏鳯如喜鵲色紺碧頸毛類雄雞鬃頭有冠尾垂二弱骨各長一尺四五寸其杪始有羽毛一簇冠尾絶異大略如鳯鳴聲清越如笙簫能度曲妙合宮商教之精熟者至能終一闋又能為百蟲之音生左右江溪洞中極難得飼以生物故又難蓄南方珍禽之尤然書傳未之紀當為難得人罕識云秦吉了秦吉了如鴝鵒紺黑色丹咮黃距目下連頂有深黃文頂毛有縫如人分髮能人言及咳嗽謳吟聞百蟲音隨輒效學比鸚鵡尤慧大扺鸚鵡聲如兒女秦吉了聲則如丈夫出雍州溪洞中唐書林邑出結遼鳥林邑今占城去雍欽州但隔交址疑即吉了也白樂天諷諫又自有秦吉了詩翡翠翡翠産于深廣山澤間穴巢于水次一壑之水止一雌雄外有一焉必爭界而死鬪人乃用其機養一媒擎諸左手以行澤中翡翠見之就手格鬪不復知有人也乃以右手取羅掩之無能脫者雍州右江産一等翡翠其背毛悉是翠茸窮侈者用以撚織鴈雁秋南春北謂之陽鳥吳中太湖雖盛夏亦有留雁蓋太湖深處至涼且有魚蚌可戀也衡陽有回雁峯云雁至此不復南征余在靜江數年未嘗見一雁益信有回雁之説蓋靜江雖無瘴癘而深冬多類淺春故雁不至況于深廣常燠之地乎靈鶻雍州有禽曰靈鶻狀如啄木而差大巢于木穴生子其中人以木窒其穴鶻至無所歸乃至地禹步俄而所窒躍去乃得入穴其後以灰布地而窒其穴欲觀其步而效之鶻既步急以爪畫步而入穴人欲效之無由骨噪雍州有禽曰骨噪似竹雞生茅茨中人即其巢原本闕三字折其骨母乃原本闕一字藥如馬腦大方寸許原本闕三字之骨復能步人逐其母奪其藥竟不知原本闕三字以用但以囊盛藥為小兒辟惡久而藥亦復不見謹收不過原本闕鴆雍州溪洞深山有鴆鳥形如鴉而差大黑身紅目音如羯鼓唯食毒蛇鴆禹步遇蛇其聲邦邦然蛇入石穴鴆於穴外禹步有頃石碎吞之凡有鴆山草木悉枯鴆集于石其石必裂或云鴆秋冬脫羽人以銀作爪勾取致之銀瓶否則手爛欲加鴆于人以一羽致酒即死春蟲白鳥鶬鸛之屬秋則自北而南春則自南而北猶鴈然而地不同靜江府人謂之春蟲欽州蓋春蟲南歸之地也靜江之興安靈川縣其人善捕池塘平野髙木淺林無非機穽春蟲北出必過二縣欲宿倣徨不敢下其捕法云先馴一春蟲為媒則於水塘遍插偽禽若啄若立之勢以為之誘又於塘側跨水結小低屋以蔽人形每晚殺小蝦蟇數籃置之小屋中忽見春蟲羣飛縱媒誘之以下其媒能前後邀截必誘入塘乃止噫此禽真賣友者耶春蟲既巳下人乃於小屋中暗擲蝦蟇媒先來食人乃設機械暗於水中鈎其腳而取之其為械也製鐵鈎如鸛觜當其折曲處又折為小環如鵝目令稍缺可以鈎陷春蟲之脛於鈎之柄立小梃寸許以為暗行水中度春蟲近屋取食人以鐵鈎暗鈎其足脛微掣鈎令脛陷入小環而不得脫乃急於水裏拽入小屋拔其六翮復縱焉已不能飛姑留之以疑衆禽少留乃得以次取之鶉子廣西海山多鶉雷化間羅為鮓至富也鶉乃海中黃魚所化成者黃魚當秋冬羽翼已化于水中俟北風拍岸遂登岸成鶉便能行入茅葦海南人捕得黃魚有半化為鶉者莊周鵾鵬之喻小大不同其義一也余嘗推其為物未有非類而能化者鳥魚皆生於隂豈非質異而性同歟鬪雞芥肩金距之技見於傳而未之覩也余還自西廣道番禺乃得見之番禺人酷好鬪雞諸番人尤甚雞之産番禺者特鷙徑善鬪其人飼養亦甚有法鬪打之際各有術數注以黃金觀如堵墻也凡雞毛欲踈而短頭欲緊而小足欲直而大身欲竦而長目欲深而皮厚徐步耽視毅不妄動望之如木雞如此者每鬪必勝人之養雞也結草為墩使立其上則足嘗定而不傾置米髙於其頭使聳膺髙啄則頭常豎而觜利割截冠緌使敵雞無所施其觜剪刷尾羽使臨鬪易以盤旋常以翎毛攪入雞喉以去其涎而掬米飼之或以水噀兩腋調飼一一有法至其鬪也必令死鬪勝負一分死生即異蓋鬪負則喪氣終身不復能鬪即為鼎實矣然常勝之雞亦必早衰以其每鬪屢濵死也鬪雞之法約為三間始鬪少頃此雞失利其主抱雞少休去涎飲水以養其氣是為一間再鬪而彼雞失利彼主亦抱雞少休如前養氣而復鬪又為一間最後一間兩主皆不得與二雞之勝負生死決矣雞始鬪奮擊用距少倦則盤旋相啄一啄得所觜牢不捨副之以距能多如是者必勝其主喜見於色蕃人之鬪雞乃又甚焉所謂芥肩金距真用之其芥肩也末芥子摻于雞之肩腋兩雞半鬪而倦盤旋伺便互刺頭腋下翻身相啄以有芥子能眯敵雞之目故用以取勝其金距也薄刃如爪鑿柄於雞距奮擊之始一揮距或至斷頭蓋金距取勝於其始芥肩取勝於其終季孫於此能無怒耶小人好勝為此凶毒使微物不得生自三代已然長鳴雞長鳴雞自南詔諸蠻來一雞直銀一兩形矮而大羽毛甚澤音聲圓長一鳴半刻潮雞廣州有潮雞潮至則啼身小足矮昔余襄公靖詩云客聼潮雞迷早夜人瞻颶母識隂晴是也枕雞欽州有小禽一種大如初生雞兒毛翎純黑項下有橫白毛向晨必啼如雞聲而細人置之枕間以之司晨亦名曰鶉子余命曰枕雞翻毛雞雞翮翎皆翻生彎彎向外雌雄皆然二廣皆有之
