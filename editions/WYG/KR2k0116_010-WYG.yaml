body:
  text: 嶺外代答巻十宋周去非撰蟲魚門蚺蛇蚺蛇能食獐鹿人見獐鹿驚逸必知其為蛇相與赴之環而謳歌呼之曰徒架反謂姊也蛇聞歌即俛首人競採野花置蛇首蛇愈伏乃投以朩株蛇就枕焉人掘坎枕側蛇不顧也坎成以利刃一揮墮首於坎急壓以土人乃四散食頃蛇身騰擲一方草朩為摧既死則剝其皮以鞔皷取其膽以和藥飽其肉而棄其膏盖膏能痿人陽道也人謂大風油即稱蚺蛇膏非是夫蛇之死可謂愚矣然天地之間物理有不可曉者以蛇之大而甘受制誠愚然特其未見水耳彼一見水必夭矯其形不受制伏起而吞人雖不遇水有小兒在側亦忽吞之是其死也殆有機緘者存非蛇之愚也六目龜聞欽七洞有六目龜欣然異之因人求得乃真目之上有四偽目耳所謂偽目即頭上金黄花紋圓長中黑似目也然偽目與真目排比正正不偏無一不然亦足愛矣常龜養之不死是龜旬日即死是殆不以龜養龜而然歟鼊瑇瑁欽海有介屬曰鼊大如車輪皮裏有薄殻十三片如瑇瑁今人用以為箆刀筒子者是也瑇瑁背甲亦十三片自然成斑紋世言鞭血成斑斯言妄矣蟺音壇欽州海濵有穴處水族曰蟺狀如龍而無角長五尺許蜑人得之縶而售諸市有管界廵檢劉昂者見而市之将烹同僚念其形之似神物也請縱之江方其未得水則類死矣一得水則奮迅蹴踏夭矯㓕没波頭為起俄然而逝彼么麽其形而猶若是况真龍㢤鱘鰉魚春水發生鱘鰉大魚自南海入江至潯象之境龍門之下或爲漁網所得余東歸將至番禺有蜑急棹就舟縶二鱘鰉求售大者長六尺小者四尺脩􅈹侈腮口隱於頤身無細鱗上各有鋒刄與凡魚不同惻然念曰神龍之稺乃受制於人如此哉問所需㡬何曰四百即市而縱焉始則舉首出水少焉揚鬐掉尾復舉首似顧悠然而逝矣嘉魚蒼梧大江之南山曰火山下有丙穴嘉魚出焉所謂南有嘉魚詩人之傳也嘉魚形如大鰣魚身腹多膏其土人煎食之甚羙其煎也徒置魚於乾釡少焉膏溶自然煎熬不别用油謂之自裹河魚左氏河魚腹疾語迄無定說余仕古縣常食市魚􅌮者曰此魚病肚不堪食剖視之滿腹黄水也後汎舟見一魚死于舟側舟人曰此魚病肚死矣問何謂病肚曰凡物皆有疾魚在水無他疾唯病肚乃死因悟申叔時河魚之說竹魚鰕魚竹魚出灕水状似青魚味如鱖魚蝦魚亦出灕水肉白而豐味似蝦而鬆羙大抵南中魚品如鯉鯽者甚多而以鰕竹二魚為珍鬼蛺蝶鬼蛺蝶大如扇四翅共徑六七寸褐質間雜色晃然下兩翅各有翠㸃尤光彩好飛荔枝上黑蛺蝶黒蛺蝶大如扇橘蠧所化翅墨黒而有翠純一行特為鮮明北人或名元武蟬天蝦南方有飛蟲有翅如飛蛾其尾如蟋蟀色白身長似小蝦然夏秋之間晚飛蔽天堕水人以長竹竿横江面使風約之如萍之聚早乃棹舟摶取縷肥肉合以為鮓味頗羙然此夜堕水次早即取乃可用稍遲一夕已脫而化矣􅈮余在欽一夕燕坐見有似蜴蜥而差大者身黄脊黒頭有黒毛抱疎籬之杪張額四顧聳身如將躍也適有士子相訪因請問之答曰此名十時其身之色一日之内逐時有異口嘗含毒俟人過則射其影人必病余曰非所謂􅈮者歟生曰然書傳所載即是物也未㡬余染瘴㡬殆古跡門韶石韶石山在韶州東北髙七十丈濶一百五十丈昔虞舜登此石奏韶樂因以名州晉永和二年有飛仙逰其上張循州韶石圖有三十六石名因具于左新婦石毬門石大禾倉石小禾倉石太平石盤龍石獅子石侍石上鱗魚石下鱗魚石帽子峰石鳳閣石羅仙峰石雙闕石馬鞍石四接石使石續石三峯石桃石大香鑪石小香爐石駱駞石奏樂石樓閣石寳蓋石硯面石虹霓石朝仙峰石覆船石五羊石圓石嵓鐘石石臼石井秦城湘水之南靈渠之口大融江小融江之間有遺堞存焉名曰秦城實始皇發謫戌五嶺之地秦城去靜江城北八十里有驛在其旁張安國紀之以詩曰南防五嶺北防胡猶復稱兵事逺圖桂海冰天塵不動誰知壠上兩耕夫北二十里有險曰嚴闗羣山環之鳥道微通不可方軌此秦城之遺跡也形勢之險襟喉之㑹水草之羙風氣之佳真宿兵之地據此要地以臨南方水已出渠自是可以方舟而下陸茍出闗自是可以成列而馳進有建瓴之利勢退有重險之可蟠宜百粤之君委命下吏也緑珠井鬱林州博白縣古白州也晉石崇妾緑珠實生焉有井名緑珠云其鄉飲是多生羙女異時鄉父老有識者聚而謀窒是井後生女乃不甚羙或羙必形不具深山大澤實生龍蛇掩井之人亦云智矣古富州古富州今昭州昭平縣在灕江之濵荆棘叢中止有三家茅屋及一縣衙其所謂三家市也有舟人登岸飲醉遂宿茅屋家夜半覺門外托托有聲主人戒之曰毋開門此虎也奴起而視之乃一乳虎將數子以行今為縣乃爾不知昔日何以為州耶銅柱漢馬伏波平交趾立銅柱為漢極西界唐馬揔為安南都護夷獠為建二銅柱於伏波之處以眀揔為伏波之嗣是銅柱在安南矣又唐何履先定南詔復立馬援銅柱按南詔今大理國則是銅柱復當在大理又占不勞之地南有大浦有五銅柱山形若倚蓋西重巖東崖海按占不勞今占城也然則銅柱又當在占城聞欽境古森峒與安南抵界有馬援銅柱安南人每過其下人以一石培之遂成邱陵其說曰伏波有誓云銅柱出交阯滅培之懼其出也又云交阯境内有數銅柱未知孰是陟屺寺欽州靈山縣東南三十里有武利場俗傳唐則天母氏故里也去場不逺有陟屺寺遺址云則天念母為建寺祈福之地猶有豐碑斷裂茅榛間字畫略可辨其文則盧肇奉勑撰按則天父武士矱晉人母楊未詳家何地后得志封榮國夫人榮國卒后出珍幣建佛廬以徼福然則陟屺之說固苗裔矣惜肇碑剥落不可考也然亦可疑肇袁州人奮跡武宗朝去則天固逺將奉何勑作記耶交阯記曰南方曰蠻雕題交阯有不火食者矣交州記曰交阯之人出南定縣足骨無節身有毛卧者更扶始得起余至欽見夫黒齒跣足皂其衣裳者人耳烏覩所謂足無節身有毛者哉人言道州侏儒今道州人七尺而昭州恭城縣與道接畛間産一二侏儒竊意南定縣如恭城也不然豈其人足皆無節而能更相扶耶間受戾氣遂以得名意當如此儋耳儋耳今昌化軍也自昔謂其人耳長至肩故有此號今昌化曷嘗有大耳兒哉蓋南蕃及黎人人慕佛相好故作大環以墜其耳俾下垂至肩實無益於耳之長其竅乃大寸許冰井火山梧州城東有方井二冰泉清冽非南方水泉比也謂之冰井其南隔江有火山下有丙穴嘉魚生焉元次山嘗為梧州有火山無火冰井無冰之句蠻俗門蠻俗蠻夷人物强悍風俗荒恠中國姑覊縻之而已其人徃徃勁㨗能辛苦穿皮履上下山如飛其械器有桶予甲長槍手標偏刀逿原闕二字牌山弩竹箭桄榔箭之屬民編竹苫茅為兩重上以自處下居雞豚謂之麻欄生理茍簡冬編鵝毛木棉夏緝蕉竹麻紵為衣摶飯掬水以食家具藏土窖以備冦掠土産生金銅鉛緑丹砂翠羽洞緂練布八角茴香草果諸藥各逐其利不困乏今黄姓尚多而儂姓絶少智髙亂後儂氏善良許從國姓今多姓趙氏宜州徼外西原黄峒武陽羣小蠻即唐黄家賊之地崇建南丹使控制之然莫氏家人亦有時相攻奪其刺史莫延葚逐其弟延廪而自立延廩奔朝廷謂之出宋凡州峒歸明者皆稱出宋延甚滛酷不能服其類鄰永樂州王氏與為仇嵗相攻官反為和解延葚恃此益驕不奉法至私刻經畧安撫司及宜州溪峒司印效帥守花書行移以嚇諸蕃落邉將常恭懐姦利與交通囊囊為代作奏章冒至闕下不闗白經畧司范石湖作帥捕劾以聞削籍竄之其後稍讋獠俗獠在右江溪峒之外俗謂之山獠依山林而居無酋長版籍蠻之荒忽無常者也以射生食動而活蟲豸能蠕動者皆取食無年甲姓名一村中推有事力者曰郎火餘但稱火嵗首以土杯十二貯水隨辰位布列郎火禱焉經夕集衆徃觀若寅有水而夘涸則知正月雨二月旱自以不差諸蕃嵗賣馬於官道其境必要取貨及鹽牛否則梗馬路官亦以鹽綵和謝之舊傳其類有飛頭鑿齒􅈹飲白衫花面赤裩之屬二十一種今右江西南一帶甚多殆百餘種也唐房千里異物志言獠婦生子即出夫憊卧如乳婦不謹則病其妻乃無苦入寮邕州諸溪峒相為婚姻峒官多姓黄悉同姓婚也其婚嫁也唯以麤豪庸優為尚送定禮儀多至千人金銀幣帛固無而酒鮓為多然其費亦云甚矣壻來就親女家於所居五里之外結草屋百餘間與居謂之入寮壻家以鼓樂送壻入寮女家亦以鼓樂送女徃寮女之婢妾百餘壻之僕從至數百人結婚之夕男女家各盛兵為備少有所爭則兵刄交接成婚之後壻常袖刀而行妻之婢少迕其意即手殺之謂之逞英䧺入寮半年而後婦歸夫家夫自入寮以來必殺婢數十而後妻黨畏之否則以為懦掛劒邕州溪峒之外西南有蠻其夫甚剛其妻甚怯夫婦異室妻之所居深藏不見人形夫過其妻必掛劒于門而後入其合夫婦之道夜期於深山不以行所居也云不如是則鬼物有顯誅繡靣海南黎女以繡靣為飾蓋黎女多羙昔嘗為外人所竊黎女有節者湼靣以礪俗至今慕而效之其繡靣也猶中州之筓也女年及筓置酒㑹親舊女伴自施針筆為極細花卉飛蛾之形絢之以遍地淡粟紋有晳白而繡文翠青花紋曉了工緻極佳者唯其婢使不繡邕州溪峒女使懼其逃亡則黥其靣與黎女異矣鼻飲邕州溪峒及欽州村落俗多􅈹欽􅈹飲之法以瓢盛少水置鹽及山薑汁數滴於水中瓢則有竅施小管如瓶嘴挿諸􅈹中𨗳水升腦循腦而下入喉富者以銀為之次以錫次陶器次瓢飲時必口噍魚鮓一片然後水安流入鼻不與氣相激既飲必噫氣以為凉腦快膈莫若此也止可飲水謂飲酒者非也謂以手掬水吸飲亦非也史稱越人相習以􅈹飲得非此乎飛駞交阯俗上已日男女聚㑹各為行列以五色結為毬歌而抛之謂之飛駞男女自成則女受駞而男婚已定踏揺猺人每嵗十月旦舉峒祭都貝大王於其廟前㑹男女之無夫家者男女各辨連袂而舞謂之踏揺男女意相得則男吚嚶奮躍入女羣中負所愛而歸於是夫婦定矣各自配合不由父母其無配者姑俟來年女三年無夫負去則父母或殺之以為世所棄也欵塞史有欵塞之語亦曰納欵讀者畧之蓋未覩其事爾欵者誓詞也今人謂中心之事為欵獄事以情實為欵蠻夷効順以其中心情實發其誓詞故曰欵也乾道丁亥靜江猺人犯邉范石湖檄余白事帥府與聞團結邉民之事猺人計窮出而歸命乃詣帥府納欵其詞曰某等既充山職今當鈐束男女男行把棒女行把麻任從出入不得生事若生事者上有太陽下有地宿其翻背者生男成驢生女成猪舉家絶滅不得翻面說好背面說惡不得偷寒送煖上山同路下水同船男兒帶刀同一邉一㸃一齊同殺盗賊不用此欵並依山例山例者殺之也他語甚鄙不可記憶聊記其所謂欵者如此木契猺人無文字其要約以朩契合二板而刻之人執其一守之甚信若其投牒于州縣亦用木契余嘗攝静江府靈川縣有猺人私爭赴縣投朩契乃一片之板長尺餘左邉刻一大痕及數十小痕于其下又刻一大痕于其上而於右邉刻一大痕牽一線道合于右大痕又于正面刻為箭形及以火燒為痕而鑽板為十餘小竅各穿以短稻穰而對結縐焉殊不曉所謂譯者曰左下一大痕及數十小痕指所論仇人將帶徒黨數十人以攻我也左上一大痕詞主也右一大痕縣官也牽一線道者詞主遂投縣官也刻為箭形言仇人以箭射我也火燒為痕乞官司火急施行也板十餘竅而穿草結縐欲仇人以牛十餘頭備償我也結縐以喻牛角云打甏溪峒及邕欽瓊廉村落間不飲清酒以小甕乾醖為濃糟而貯留之每觴客先布席于地以糟甕置賓主間别設水一盂副之以杓開甕酌水入糟挿一竹管管長二尺中有闗捩狀如小魚以銀為之賓主共管吸飲管中魚閉則酒不升故吸之太緩與太急皆足以閉魚酒不得而飲矣王飲魚閉取管埋之以授客客復吸飲再埋管以授主飲將竭再酌水攪糟更飲至甚醨而止其為夀也不别設酒主人妻子出而夀客妻先酌水入甕致詞以管授客飲已男若女迭酌水為夀客之多飲夀酒也實多飲水耳名曰打甏南人謂甕為甏抵鵶自安南及占城真臘皆有肩輿以布為之製如布嚢以一長竿舉之上施長篷以木葉鱗次飾之如中州轎頂也二人舉一長竿又二人榮行安南名曰抵鵶安南使者黄榮以一抵鵶載一妾自隨凡使者至欽皆有凉轎釘鉸黒漆甚澤而兩竿盡短雨晴皆用之此盖效中國為之也若其本國只用抵鵶爾十妻南方盛熱不宜男子特宜婦人蓋陽與陽俱則相害陽與隂相求而相養也余觀深廣之女何其多且盛也男子身􅄱卑小顔色黯惨婦人則黒理充肥少疾多力城郭虚市負販逐利率婦人也而欽之小民皆一夫而數妻妻各自負販逐市以贍一夫徒得有夫之名則人不謂之無所歸耳為之夫者終日抱子而逰無子則袖手安居群婦各結茅散處任夫徃來曽不之較至于溪峒之首例有十妻生子莫辨嫡庶至于讐殺云捲伴深廣俗多女嫁娶多不以禮商人之至南州竊誘北歸謂之捲伴其土人亦自捲伴不能如商人之徑去則其事乃有異始也既有桑中之約即暗置禮聘書于父母牀中乃相與宵遁父母乍失女必知有書也索之袵席間果得之乃聲言訟之而迄不發也嵗月之後女既生子乃與壻備禮歸寧預知父母初必不納先以醨酒入門父母佯怒撃碎之壻因請託鄰里祈懇父母始需索聘財而後講翁壻之禮凡此皆大姓之家然也若乃小民有女惟恐人不誘去耳徃誘而不去其父母必勒女歸夫家且其俗如此不以為異也鬭白馬廣人妻之父母死壻致祭必乗馬而徃以二牌棒手前導將至妻家駐馬以待妻家亦以二牌棒手對敵謂之鬭白馬壻勝則祭得入不勝則不得入故壻家必勝以入其祭迎茅娘欽㢘子未娶而死則束茅為婦于郊備鼓樂迎歸而以合𦵏謂之迎茅娘昔魏武愛子蒼舒卒聘甄氏亡女合𦵏眀帝愛女淑卒娶甄氏亡孫合𦵏欽之迎茅娘夷風也曹氏父子直為㝠婚豈足尚哉志異門天神廣右敬事雷神謂之天神其祭曰祭天蓋雷州有雷廟威靈甚盛一路之民敬畏之欽人尤畏圃中一木枯死野外片地草木萎死悉曰天神降也許祭天以禳之茍雷震其地則又甚矣其祭之也六畜必具多至百牲祭之必三年初年薄祭中年稍豐末年盛祭每祭即養牲三年而後克盛祭其祭也極謹雖同里巷亦有懼心一或不祭而家偶有疾病官事則鄰里親戚衆尤之以為天神實為之災聖佛南海諸蕃國皆敬聖佛相傳聖佛出世在真臘國之占里婆城聖佛女子也有夫渡海而舟為龍王所蕩乃謂龍王曰使我登岸當嵗生一子以奉龍王既海神送其舟于占里婆城乃顯神異人有慢輕必降禍焉人有祈求必赴感焉人有自欺於前必報驗焉南蕃皆敬事之凡相爭者必相要質于聖佛前曲者不敢徃也南蕃所居皆茅廬唯聖佛廟貌甚整黄金飾像四軀為四殿盖一佛而三夫也女巫數輩謂之夷婆廟多鼓舞血食無虚日每嵗正月十三日設廬于廟前積禾于中請聖像出廟而焚禾以祭十四日聖佛歸廟二十日聖佛生子乃忽有一圓石出其身二十日夜舉國人民不寢以聽佛之生子眀日國人皆奉珍寳犀象獻佛其所生子舟載而投諸海以奉龍王云六合之外妖祥恠誕愈多如此甯諫議欽州甯諌議廟去城數十里太守到任謁之雨𤾉不時禱之輙應六朝時有甯猛力據有其地隋朝因拜猛力為安州刺史然恃險驕倨自若也自令狐熙為桂州總管諭以㤙信乃詣府請謁後熙奏改安州為欽州猛力欲隨使者何稠入朝而死其子長真𦵏畢即入朝乃以長真嗣為欽州刺史唐髙祖授長真欽州都督長真死子據襲刺史然則諌議其猛力歟猛力􅆟有功于欽欽人即其墓宅社而稷之置祭田數頃諸甯掌之至今尚存諸甯今為大姓每科舉嘗有薦名者欽之祀無非滛祠惟諌議為正武婆婆廣右人言武后母本欽州人今皆祀武后也冠帔巍然衆神環坐所在神祠無不以武為尊巫者招神稱曰武太后娘娘俗曰武婆婆也轉智大王欽守陳承制名永泰熙寧八年交阯破欽死于兵先是交人謂欽人曰吾國且襲取爾州以告永泰弗信交舟入境迅甚永泰方張飲又報抵城復弗顧交兵入城遂擒承制以下官屬於行衙曰不殺汝徒取金帛爾既大掠則盡殺之欽人塑其像于城隍廟祀之號曰轉智大王凡嘲人不慧必曰陳承制云新聖廣西凌鐵為變鄧運使擒之盖殺降也未㡬鄧卒若有所覩廣西羣巫乃相造妖且明言曰有二新聖曰鄧運使凌太保必速祭不然癘疫起矣里巷大讙結竹粘紙為轎馬旗幟器械祭之于郊家出一雞既祭人懼而散巫獨攜數百雞以歸因嵗嵗祠之巫定例云與祭者不得受胙故巫嵗有大獲在欽為尤甚雞卜南人以雞卜其法一小雄雞未孳尾者執其兩足焚香禱所占而撲殺之取腿骨洗淨以麻線束兩骨之中以竹梃插所束之處俾兩腿骨相背于竹梃之端執梃再禱左骨為儂儂者我也右骨為人人者所占之事也乃視兩骨之側所有細竅以細竹梃長寸餘者遍挿之或斜或直或正或偏各隨其斜直正偏而定吉凶其法有一十八變大抵直而正或附骨者多吉曲而斜或逺骨者多凶亦有用雞卵卜者焚香禱祝書墨於卵記其四維而煑之熟乃横截視當墨之處辨其白之厚薄而定儂人吉凶焉昔漢武奉越祠雞卜其法無傳今始記之茅卜南人茅卜法卜人信手摘茅取占者左手自肘量至中指尖而斷之以授占者使禱所求即中摺之祝曰奉請茅將軍茅小娘上知天綱下知地理云云遂禱所卜之事口且禱手且掐自茅之中掐至尾又自茅中掐至首乃各以四數之餘一為料餘二為傷餘三為疾餘四為厚料者雀也謂如占行人早占遇料行人當在路此時雀已出窠故也日中占遇料則行人當晚至時雀至暮當歸爾晚占遇料則雀已入窠不歸矣傷者聲也謂之􅀏面猫其卦甚吉百事歡欣和合疾者黒面猫也其卦不吉所在不和合厚者滯也凡事遅滯茅首餘二名曰料貫傷首餘三名曰料貫疾餘皆倣此南人卜此最驗精者能以時辰與茅折之委曲分别五行而詳說之大抵不越上四餘而四餘之中各有吉凶又係乎所占之事當卜之時或遇人來則必别卜曰外人踏斷卦矣余以為此法即易卦之世應揲蓍也嘗聞楚人篿卜今見之南法祝融之墟威靈所萃其間異法亦天地造化之流也巫以荆得名豈無自而然哉嘗聞巫覡以禹歩呪訣鞭笞鬼神破廟殞竈余嘗察之南方則果有源流蓋南方之生物也自然禀禁忌之性在物且然况於人乎邕州溪峒有禽曰靈鶻善禹歩以去窒塞又有鴆鳥亦善禹歩以破山石有􅈮日十二時能含毒射人影以致病以是觀之南人之有法氣類實然然今巫者畫符必為鴆頂之形亦可見其源流矣是故愈西南愈多詭異茫茫天地法各有本必有精于法者夫亦云自然而然非人所能為也家鬼家鬼者言祖考也欽人􅆟畏之村家入門之右必為小巷升堂小巷右壁穴隙方二三寸名曰鬼路言祖考自此出入也人入其門必戒以不宜立鬼路之側恐妨家鬼出入嵗時祀祖先即于鬼路之下陳設酒肉命巫致祭子孫合樂以侑之窮三日夜乃已城中居民於㕔事上置香火别自堂屋開小門以通街新婦升㕔一拜家鬼之後竟不敢至㕔云儻至則家鬼必擊殺之惟其主婦無夫者乃得至㕔挑生廣南挑生殺人以魚肉延客對之行厭勝法魚肉能反生于人腹中而人以死相傳謂人死隂役于其家有一名士嘗為雷州推官親勘一挑生公事置肉盤下俾囚作法以驗其術有頃發視肉果生毛何物􅁋鬼乃能爾也然解之亦甚易但覺有物在胷膈則急服升麻以吐之覺在腹中急服鬱金以下之此方亦雷州鏤板印散者蓋得之于囚也蠱毒廣西蠱毒有二種有急殺人者有慢殺人者急者頃刻死慢者半年死人有不快于已者則陽敬而隂圖之毒發在半年之後賊不可得藥不可解蠱莫惨焉乾道庚辰欽州城東有賣漿者蓄蠱毒敗而伏辜云其家造毒婦人倮形披髪夜祭作糜粥一盤蝗蟲蛺蝶百蟲自屋上來食遺矢乃藥也欲知蠱毒之家入其門上下無纎埃者是矣今黎峒溪峒人置酒延客主必先嘗者示客以不疑也罔兩淳熙乙未正月朔罔兩見于融州融水縣治有人之影無人之形倮而披髪者無萬數有一手力持紙錢焚之影競赴火又復散亂有頃乃沒是日城外有神廟煙火自地出經日而滅一郡大驚鄭隕夢為融教官親見而言之是年融不聞有異栁州蜈蚣栁州種甘堂頃年夜有光出柱上蠧穴中滿堂如月剔視見鱗甲大如鏡太守知異物集吏卒持斧鋋齊刺之有聲砉然破柱乃大蜈蚣長竟柱腦中得珠如鵝卵圓走盤光遂不見桂林猴妖靜江府疊綵巖下昔日有猴夀數百年有神力變化不可得制多竊美婦人歐陽都護之妻亦與焉歐陽設方畧殺之取妻以歸餘婦人悉為尼猴骨𦵏洞中猶能為妖向城北民居每人至必飛石惟姓歐陽人來則寂然是知為猴也張安國改為仰山廟相傳洞内猴骨宛然人或見眼忽微動遂驚去矣
