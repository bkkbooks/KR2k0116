body:
  text: 嶺外代荅巻八宋周去非撰花朩門果實附草附桂南方號桂海秦取百粤號曰桂林桂之所産古以名地今桂産於欽賔二州于賔者行商陸運致之北方于欽者舶商海運致之東方蜀亦有桂天其以為西方所資歟桂之用於藥尚矣枝能發散肉能補益二用不同桂性酷烈易以發生古聖人其知之矣桂枝者發達之氣也質薄而味稍輕故傷寒湯飲必用桂枝發散救裏最良肉桂者温厚之氣也質厚而味沉芳故補益圎散多用肉桂今醫家謂桂年深則皮愈薄必以薄桂為良是大不然桂朩年深愈厚耳未見其薄也以醫家薄桂之謬考於古方桂枝肉桂之分斯大異矣又有桂心者峻補藥所用也始剥厚桂以利竹棬曲刮取貼朩多液之處状如經帶味最沉烈於補益尤有功桂開花如海棠色淡而葩小結子如小橡子取未放之蕋乾之是為桂花宛類茱茰藥物之所緩而食品之所湏也種桂五年乃可剥春二月秋八月朩液多剥之時也桂葉比朩樨葉稍大背有直脉三道如古圭製然因知古人製字為不茍云榕榕易生之朩又易髙大葉如槐輪囷䕃樾可覆數畝者甚多根出半身附榦而下壟壟抱持以入土故有榕朩倒生根之語四時結子葉脫亦無時隨落隨生春時亦摇落滿庭禽鳥銜其子寄生它朩上便欝茂根鬚沿朩身垂下至地得土氣滋植盛壮久則過其所寄或遂包裹之栁州栁侯廟庭前大榕有桄榔一株生其中相傳以為異知者以為夲榕子寄生桄榔上嵗久反抱合之非異也榕閩中亦有之沙朩沙朩與杉同類尤髙大葉尖成叢穗小與杉異猺峒中尤多劈作大板背負以出與省民博易舟下廣東得息倍稱燕脂朩燕脂朩堅緻色如燕脂可鏇作出融州及州峒桂林属縣有之思櫑朩思櫑朩生兩江州峒堅入清水中百年不腐峒人及交阯以為弓弩標槍之材為天下最檳榔檳榔生海南黎峒亦産交阯朩如棕櫚結子葉間如栁條顆顆叢綴其上春取之為軟檳榔極可口夏秋採而乾之為米檳榔漬之以鹽為鹽檳榔小而尖者為雞心檳榔大而匾者為大腹子悉下氣藥也海商販之瓊管収其征嵗計居什之伍廣州稅務収檳榔稅嵗數萬緡推是則諸處所収與人之所取不可勝計矣桄榔桄榔朩似棕櫚有節如大竹青緑聳直髙十餘丈有葉無枝䕃緑茂盛佛廟神祠亭亭列立如寳林然結子葉間數十穗下垂長可丈餘翠緑㸃綴有如纓絡極堪觀玩其根皆細鬚堅實如鐡鏇以為器悉成孔雀尾斑世以為珍朩身外堅内腐南人剖去其腐以為盛溜力省而功倍溪峒取其堅以為弩箭沾血一滴則百裂於皮裏不可撤矣不唯其朩見血而然雖朩液一滴着人肌膚即遍身如針刺是殆朩性将行於氣血也歟凡朩似棕櫚者有五桄榔㯽榔椰子䕫頭桃竹是也㯽榔之實可施藥物䕫之葉可以盖屋桃竹可以為杖椰子可以為果蓏若桄榔則為器用而可以永久矣椰子木椰木身葉悉類棕櫚桄榔之属子生葉間一穗數枚枚大如五升器果之大者惟此與波羅蜜耳初採皮甚青嫩已而變黄久則枯乾皮中子殻可為器子中穰白如玉味羙如牛乳穰中酒新者極清芳久則渾濁不堪飲竹嶺南竹品多矣傑異者數種因録于後斑竹夲出全之清湘桂林属縣皆有之初生時但㸃㸃淡青靨如苔痕久則青退而紫斑漸眀中有疊暈江浙間斑竹直一沁痕而無暈也澀竹一名思勞竹每一節上半猶是常竹其半筠膚粗澀視之似生細毛可以錯磨爪甲人取其澀處削成錯子黒漆其裏以相贈遺用久刓滑醋浸少頃火炙乾復澀矣老者彌澀然亦竒物邕州兩江多有之簜竹葉大且密略如蘆葉穠隂鬰然它竹不逮節上出小筍籜破成枝春深根旁大筍才出經冬不已極易種竻竹其上生刺南人謂刺為竻種之極易宻久則堅甚新州素無城以此竹環植號曰竹城交阯外城亦種此竹人面竹節宻而凸横斜相間每凸處突出長圎宛如人面近根之處㡬百節宻宻相聚人亦採為拄杖釣絲竹身葉皆類簜竹枝極柔弱垂下摇曳數尺如釣絲可愛筍瘦而白於食品最佳箭竹山中悉有之諸郡治兵器各自足用不求之嶺北桂林十二枝箭為錢二百則其簳賤可知矣荔枝圎眼荔枝廣西諸郡所産率皮厚肉薄核大味酸不宜曝乾非閩中比佳者莫如興化海南荔子可比閩中不及興化矣然廣西諸郡富産圎眼大且多肉逺勝閩中邕州唯官荘所産數根絶竒肉厚味長又當與興化皺玉比矣静江一種曰龍荔皮則荔子肉則元眼其葉與味悉兼二果色青時便熟後但㣲黄可蒸食如熟栗不可生噉令人發癎多食能生疾與茘枝同時紅鹽草果邕州取新生草果入梅汁鹽漬令色紅暴乾薦酒芬味甚髙世珍之草豆䓻始結實如小舌即擷取紅鹽乾之名鸚哥舌尤為難得一廬山茶罐可貯五百枚八角茴香八角茴香出左右江蠻峒中質類翹尖角八出不類茴香而氣味酷似但辛烈只可合湯不宜入藥中州士夫以為薦酒咀嚼少許甚是芳香餘甘子南方餘甘子風味過於橄㰖多販入北州方實時零落藉地如槐子榆莢土人乾以合湯意味極佳其朩可以制器欽陽所産為最盖大如桃李清芬尤甚也世間百果無不軟熟唯此與橄㰖雖腐尤堅脆可以比徳君子南人有言曰餘甘一時熟獐一日肥其說盖二物忽然有異則餘甘熟一時頃而復生獐肥一日而復瘦也欽州靈山縣一士人姓甯其大父一日往山間忽見餘甘遍山如来禽紛熟飽餐快甚湏㬰便復青脆袖中猶携數熟餘甘歸以示閭里至傳為異事石栗石栗殻厚硬白褐色圎形如橡子杓栗杓栗灰褐色正圎殻硬有柄似杓蕉子芭蕉極大者凌冬不凋中抽一幹節節有花如菡萏花謝有實一穗數枚如肥皁長數寸去皮取肉軟爛如緑柿極甘冷四季實以梅汁漬暴乾按扁所云芭蕉乾是也鷄蕉則甚小亦四季實芽蕉小如鷄蕉尤香嫩甘羙南人珍之非他蕉比秋初方實烏㰖烏㰖如橄㰖青黒色肉爛而甘亦可作蔬茹核差長其中仁味鬆羙薦酒泛茶皆珍相餽遺者獨以核致逺㣲暴乾椎取仁方㰖亦橄㰖類三角或四角出兩江州峒柚子柚南州名臭柚大如𤓰人亦食之皮甚厚穰極小打碑者捲皮蘸墨以代氊刷宜墨而不損紙頗便於用也赤柚子如橄㰖皮青而肉赤春實百子南方果實以子名者百二十或云百子或云七十二子半是山野間草木實江浙山中木子亦有之猿狙所食非佳實也因録其識且可食者見于後羅晃子殻長數寸如肥皁内有二三實如皁子亦如橄㰖皮有七重煨食甘羙類熟栗亦曰羅望子朩竹子皮色形状全似大枇杷肉甘羙㣲爛子亦似枇杷核秋冬間實半青黄時採食収蔵至三四月不壊人面子如大梅李生青熟黄核如人面兩目鼻口皆具肉甘酸宜蜜餞鏤為細瓣去核按匾煎之㣲有橘柚芳氣南果之珍也五稜子按范成大桂海虞衡志作五梭子以義考之當從稜形甚詭異瓣五出如田家碌碡状皮黄甚薄味酸久則㣲甘朴切之或以蜜漬始可食閩中亦有之謂之羊桃黎䑃子如大梅復似小橘味極酸或云自南蕃来番禺人多不用醯專以此物調羮其酸可知又以蜜煎鹽漬暴乾収食之櫓罟子大如半升椀諦視之數十房攅聚成毬每房有縫如栢子之未裂攅結甚堅非刀斧不破冬生色青至夏紅破其瓣食之微甘苖叢髙丈許即成幹葉長如菱蘆刺生兩旁土人宻植以為藩籬或乾其葉去刺以織席卧之摵摵有聲搓擦子如錐栗殻中多白毛湏搓擦而後可食肉甘而㣲澀地蠶子生土中如小蠶又似甘露子而不尖味如棃藕而淡亦以薦酒火炭子如烏李山韶子色紅有刺肉如荔枝以下並夏實部蹄子按范成大桂海虞衡志作部諦子如黄大石榴朩賴子如淡黄大李黏子如指面大褐色千嵗子叢生如青黄李味甘赤棗子如酸棗㣲長味酸生巖石上藤韶子大如鳬卵蒂紅色以下並秋實古米子殻黄中有肉如米粒一顆數十粒殻子如青梅味甘藤核子生白藤上如小蒲桃一穗數百枚淡黄色朩蓮子如胡桃皮殻皆紫褐色蘿蒙子黄大如棖柚特乃子状似榧子而圎長亦類石蓮色褐有殻連殻蒸熟食之味稍淡不納子似黄熟小梅絶易爛爛則皮肉附核核可為經珠似菩提子或云頃曽進入京師被黜故以名羊矢子色状全似羊矢味亦不佳中有小核日頭子状如櫻桃色如蒲桃穗生味極甘賔州尤多秋風子色状俱似楝子味酸澀邕州有之或名隨風子増城自有隨風子入藥用非此類黄皮子如小棗甘酸佳味稍耐久可致逺朱圎子正圎深紅可玩状似苦楝子又似無蒂棠毬子微甘冬實粉骨子皮黄肉如粉味酸塔骨子匾如大橘皮裏空虚布衲子似李而黄黄肚子如小石榴皮乾硬如没石子枯莖如棘其上㸃綴布生不甚堪食蒲柰子状似棗而差圎味酸甜其核可為數珠水泡子生水濵小朩白花似玉蝴蝶結子似金甖而黄白無刺味甘多液肉理輕虚如水泡然水翁子生水濵大木葉似枇杷大如指面色紅而甘巾斗子似海紅沐浣子似棠毬色黄皮皺可浣衣牛粘子即牛妳也天威子如橄㰖而小鹽糁和之可以作鮓石胡桃生如石其中肉無㡬味與北胡桃略同頻婆果極鮮紅可愛佛書所謂唇色赤好如頻婆果是也木饅頭在中州蔓生枝葉間可以充藥物在南州則木生不生於枝葉而綴生於夲身可以為果實二物其形相類但蔓者肉薄多子未熟先落木生者肉厚中有飴蜜當其紅熟亦頗可口深廣難得佳果公筵多用以備數人乃附㑹其說曰廣中公筵刻木為饅頭識其下曰某州公庫一様若干斯言過矣藤藤梧州産大者可為胡牀小者圈為盤盂又其小而細長者織以為籠箧卧簟耐久而文理可觀其葉則以為漁父之蓑一領可終身用矣藤州州治之外嘗有古藤甚大故以名州花藤花藤在西融州藤中斕斑其花紋如攅銀杏葉或似牡丹花片照之透眀乃鏇以為器用人多珍之膽瓶蕉膽瓶蕉一根唯一身離地寸許其身特大而其上漸小至葉乃大開敷長大翠緑正如膽瓶中挿數枝蕉葉也亭館列植尤可愛玩亦名象蹄蕉言如象蹄然水蕉水蕉不結實南人取以為麻縷片乾灰煮用以織緝布之細者一匹直錢數緡紅蕉花紅蕉花葉瘦類蘆箬中心抽條條端發花葉數層日拆一兩葉色正紅如榴花荔子其端各有一㸃鮮緑尤可愛花心有鬚蒼黒色春夏開至嵗寒猶芳南山茶南山茶葩萼大倍中州者色㣲淡葉柔薄有毛結實如棃大如拳中有數子如肥皁子大别自有一種葉厚硬花深紅如中州所出者素馨花素馨花番禺甚多廣右絶少土人尤貴重開時旋掇花頭装於他枝或以竹絲貫之賣於市一枝二文人競買戴茉莉花茉莉花番禺亦多土人愛之以浙米漿日溉之則作花不絶可耐一夏花亦大且多葉倍常花六月六日又以治魚腥水一溉益佳石榴花石榴花南中一種四季常開夏中既實之後秋深復又大發花且實枝頭顆顆罅裂而其旁紅英粲然併花實折飣盤筵極可玩史君子花史君子花蔓生作架植之夏開一簇一二十葩輕盈似海棠白與深紅相雜齊開此為最異夲草謂開時白久則紅盖未詳也添色芙蓉花添色芙蓉花晨開正白已午微紅夜深紅歐陽文忠公牡丹譜有添色紅與此同意此花枝條經冬不枯有髙出屋者豆䓻花豆䓻多矣白豆䓻出南蕃草豆䓻出邕州溪峒而諸郡山間亦有豆䓻花最可愛其葉叢生如薑葉其開花抽一幹有蘀包之蘀去有花一穗蘂數十綴之悉如指面其色淡紅如蓮花之未敷又如葡萄之下垂范石湖嘗作詩有貫珠垂寳絡剪綵倒鸞枝之句南人取花漬以梅汁日乾之香味芳羙極有風致余初見之意草䓻而味辛激人亦取其子為蜜果泡花泡花南人或名柚花春來開蘂圎白如大珠既拆則似茶花氣極清芳與茉莉素馨相逼番禺人採以蒸香風味超勝桂林好事者或為之其法以佳沉香薄片劈着净器中鋪半開花與香層層相間宻封之明日復易不待花萎香蔫也花過乃巳香亦成番禺人呉宅作心字香及瓊香用素馨茉莉法亦爾大抵浥取其氣令自薫陶以入香骨實未嘗以甑釡蒸煑之曼陁羅花廣西曼陁羅花遍生原野大葉白花結實如茄子而遍生小刺乃藥人草也盗賊採乾而末之以置人飲食使之醉悶則挈箧而趍南人或用為小兒食藥去積甚峻拘那花拘那花葉瘦長略似楊梅夏開淡紅花一朶數十萼繁如紫薇花瓣有鋸文如剪金至秋深猶有之水西花水西花葉如萱草花黄夏開裹梅花裹梅花即朩槿有紅白二種葉似蜀葵采者連蒂包裹黄梅鹽漬暴乾以薦酒故名玉脩花玉脩花粉紅色四季開月禾欽州田家鹵莽牛種僅能破塊播種之際就田㸃榖更不移秧其為費種莫甚焉既種之後不耘不灌任之於天地地暖故無月不種無月不収正二月種者曰早禾至四月五月収三月四月種曰晚早禾至六月七月収五月六月種曰晚禾至八月九月収而欽陽七峒中七八月始種早禾九十月始種晚禾十一月十二月又種名曰月禾地氣既暖天時亦為之大變以至於此大蒿大蒿容梧道中久無霜雪處蒿草不凋年深滋長大者可作屋柱小亦中肩輿之杠漕属王仲顯沿檄失轎杠從者斫道旁朩代之行數里輙脆折恠視之蒿也古有蒿柱之說豈其類乎都管草都管草一莖六葉置室中辟蜈蚣蛇不敢入蛆草蛆草髙一二尺状如茅夏月挿一枝盤筵中蚊蠅不近食物亦不速腐栁州有之銅鼓草銅鼓草其實大者如𤓰小者如莱菔治瘍毒醋磨塗之石髪石髪出海上纎長如絲縷淺緑色置食肴中極可愛然易爛而薄於味匾莱匾莱出海上細如荇帶匾如薤韭長一二尺亦宜盤筯比石髪差有味筋靱可咀嚼胡蔓草廣西妖滛之地多産惡草人民亦禀惡徳有藤生者曰胡蔓葉如茶開小紅花一花一葉揉其葉漬之水㳙滴入口百竅潰血而死矣愚民私怨茹以自斃人近草側其葉自摇盖其惡氣好攻人氣血如此人将期死採其葉心嚼而水吞之面黒舌伸家人覺之急取抱卵不生雞兒細研和以麻油抉口灌之乃盡吐出惡物而甦小遲不可救矣若欲騐之齒及爪甲青探銀釵咽中銀變青黒者是也人死焚尸次日灰骨中已生胡蔓數寸此等惡種火不能焚天之生物有如此者朝廷每嵗下廣西尉司除胡蔓此亦人代天工之意勿謂其不可去而一不問也
