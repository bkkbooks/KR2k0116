body:
  text: 嶺外代答巻七宋周去非撰香門沉水香沉香来自諸蕃國者真臘為上占城次之真臘種類固多以登流眉案范成大桂海虞衡志作丁流眉宋史作登流眉所産香氣味馨郁勝於諸蕃若三佛齊等國所産則為下岸香矣以婆羅蠻香為差勝下岸香味皆腥烈不甚貴重沉水者但可入藥餌交阯與占城隣境凡交阯沉香至欽皆占城也海南黎母山峒中亦名土沉香少大塊有如繭栗角如附子如芝菌如茅竹葉者皆佳至輕薄如紙者入水亦沉萬安軍在島正東鍾朝陽之氣香尤醖藉清逺如蓮花梅英之類焚一銖許氛翳彌室翻之四靣悉香至煤燼氣不焦此海南香之辨也海南自難得省民以一牛於黎峒博香一擔歸自差擇得沉水十不一二頃時香價與白金等故客不販而宦遊者亦不能多買中州但用廣州舶上蕃香耳唯登流眉者可相頡頏山谷香方率用海南沉香蓋識之耳若夫千百年之枯株中如石如杵如拳如肘如竒禽龜蛇如雲氣人物焚之一銖香滿半里不在此類矣蓬莱香蓬莱香出海南即沉水香結未成者多成片如小笠及大菌之状極堅實状類沉香惟入水則浮氣稍輕清價亞沉香刳去其背帶木者亦多沉水鷓鴣斑香鷓鴣斑香亦出海南蓬莱好箋香中槎牙輕鬆色褐黒而有白斑㸃㸃如鷓鴣臆上毛氣尤清婉箋香箋香出海南者如蝟皮漁簔之状蓋出諸修治香之精鍾於刺端大扺以斧斫以為坎使膏液凝沍於痕中膏液垂而下結巉巖如攢針者海南之箋香也膏液湧而上結平闊如盤盂者蓬莱箋也其側結者必薄名曰蠏殻香廣東舶上生熟速結等香當在海南箋香之下衆香光香出海北及交阯與箋香同多聚於欽州大塊如山石枯槎氣麤烈如焚松檜桂林供佛賓筵多用之沉香出交阯以諸香草合和蜜調如薫衣香其氣温黁然微昏鈍排草香出日南状如白茅香芬烈如麝香亦用以合香諸草香無及之者橄欖香出廣州及北海橄欖朩節結成状如黒膠飴獨有清烈出塵之意品格在黄連楓香之上桂林東江有此居人采香賣之不能多得以純脂不雜木皮者為佳欽香味猶淺薄其朩葉如冬青而差圎皮如楮皮而差厚花黄而小子青而黒人以斧斫木為坎膏凝於痕遂採以為香香之為香良苦哉零陵香零陵香出猺洞及静江融州象州凡深山朩隂沮洳之地皆可種也逐節斷之而案説文傷也从戈才聲祖才切其節隨手生矣春暮開花結子即可割薫以烟火而隂乾之商人販之好事者以為座褥卧薦相傳言在嶺南不香出嶺則香謂之零陵香者静江舊屬零陵郡也蕃梔子蕃梔子出大食國佛書所謂簷葡花是也海蕃乾之如染家之紅花也今廣州龍涎所以能香者以用蕃梔故也又深廣有白花全似梔子花而五出人云亦自西竺来亦名簷葡此説恐非是樂器門平南樂廣西諸郡人多能合樂城郭村落祭祀婚嫁䘮塟無一不用樂雖耕田亦必口樂相之蓋日聞鼓笛聲也每嵗秋成衆招樂師敎習子弟聴其音韻鄙野無足聴唯潯州平南縣係古龔州有舊敎坊樂甚整異時有以敎坊得官亂離至平南敎土人合樂至今能傳其聲猺樂器猺人之樂有盧沙銃鼓胡盧笙竹笛盧沙之制状如古簫編竹為之縱一横八以一吹八伊嚘其聲銃鼓乃長大腰鼓也長六尺以燕脂水為腔熊皮為面皷不響鳴以泥水塗面即復響矣胡盧笙攅竹於瓢吹之嗚嗚然笛韻如常笛差短大合樂之時衆聲雜作殊無翕然之聲而多繫竹筩以相團樂跳躍以相之腰鼓静江腰鼓最有聲腔出於臨桂縣職由鄉其土特宜鄉人作窰燒腔鼓面鉄圈出於古縣其地産佳鐡鐡工善煆故圈勁而不褊其皮以大羊之革南多大羊故多皮或用蚺蛇皮鞔之合樂之際聲響特逺一二面鼓已若十面矣銅鼓廣西土中銅鼓耕者屢得之其製正圎而平其面曲其腰状若烘籃又類宣座面有五蟾分據其上蟾皆累一大一小相負也周圍欵識其圎紋為古錢其方紋如織簟或為人形或如琰璧或尖如浮屠如玉林或斜如豕牙如鹿耳各以其環成章合其衆紋大類細畫圎陣之形工巧㣲宻可以玩好銅鼓大者闊七尺小者三尺所在神祠佛寺皆有之州縣用以為更㸃交阯嘗私買以歸復埋於山未知其何義也按廣州記云俚獠鑄銅為鼓唯以髙大為貴面闊丈餘不知所鑄果在何時按馬援征交阯得駱越銅鼓鑄為馬或謂銅鼓鑄在西京以前此雖非三代彞器謂鑄當三代時可也亦有極小銅鼓方二尺許者極可愛玩類為士夫搜求無遺矣桂林儺桂林儺隊自承平時名聞京師曰静江諸軍儺而所在坊巷村落又自有百姓儺嚴身之具甚飾進退言語咸有可觀視中州装隊仗似優也推其所以然蓋桂人善製戯面佳者一直萬錢他州貴之如此宜其聞矣白巾鼓樂南人難得烏紗率用白紵為巾道路彌望白巾也北人見之遽訝曰南瘴疾殺人殆比屋制服者歟又南人死亡隣里集其家鼓吹窮晝夜而制服者反於白巾上綴少紅線以表之嘗聞昔人有詩云簫鼓不分憂樂事衣冠難辨吉㓙人是也寳貨門珠池合浦産珠之地名曰斷望池在海中孤島下去岸數十里池深不十丈蜑人没而得蚌剖而得珠取蚌以長繩繫竹藍攜之以没既拾蚌於籃則振繩令舟人汲取之没者亟浮就舟不幸遇惡魚一縷之血浮於水面舟人慟哭知其已𦵏魚腹也亦有望惡魚而急浮至傷股斷臂者海中惡魚莫如刺紗謂之魚虎蜑所甚忌也蜑家自云海上珠池若城郭然其中光恠不可向邇常有恠物哆口吐翕固神靈之所䕶持其中珠蚌終古不可得者蚌溢生於城郭之外故可採耳所謂珠熟之年者蚌溢生之多也然珠生熟年百不一二耗年皆是也珠熟之年蠻家不善為價冒死得之盡為黠民以升酒斗粟一易數兩既入其手即分為品等銖兩而賣之城中又經數手乃至都下其價遞相倍蓰至於不貲採珠在官有禁州以亷名謂其足以貪也史稱孟嘗守合浦珠乃大還為亷吏之應二十年前有守甚貪而珠亦大熟雖物理無騐然此以清名至今彼與草朩俱腐耳噫孰知孟嘗還珠之説非桞子厚復乳穴之説乎東廣海中亦有珠池偽劉置軍採之名媚川都死者甚多太祖皇帝平嶺南廢其郡為静江軍蛇珠乾道初欽州村落婦人黄氏曬禾棚屋上忽一物飛鳴而來墜其髻上復墜禾中光曜奪目盤旋不已就取乃一大珠是夜光恠滿室隣里異之里正訪知而索焉不得聞之縣官其家懼取蒸熟光遂隠後欽有士人姓甯得與赴省以萬錢賒買徃都下賈胡嘆曰此蛇珠也惜哉甯以不售攜歸還黄今其珠故在置之盤中猶有㣲暈映盤辟塵犀欽人有徃深山得大蜈蚣蛻一節尺餘堅如鐵石持歸鷄犬皆驚窓隙日影更無霏埃有博物者曰是所謂辟塵犀者耶琥珀人云茯苓在地十年化為琥珀欽人田家鋤山忽遇琥珀初不知識或告之曰此琥珀也厥直頗厚其人持以徃博易塲賣之交阯驟致大富硨磲南海有蚌屬曰硨磲形如大蚶盈三尺許亦有盈一尺以下者惟其大之為貴大則隆起之處心厚數寸切磋其厚可以為杯甚大雖以為瓶可也其小者猶可以為環佩花朶之属其不盈尺者如其形而琢磨之以為杯名曰瀲灔則無足尚矣佛書所謂硨磲者玉也南海所産得非竊取其名耶龍涎大食西海多龍枕石一睡涎沫浮水積而能堅鮫人採之以為至寳新者色白稍久則紫甚久則黒因至番禺嘗見之不薫不蕕似浮石而輕也人云龍涎有異香或云龍涎氣腥能發衆香皆非也龍涎於香夲無損益但能聚烟耳和香而用真龍涎焚之一銖翠烟浮空結而不散座客可用一剪分烟縷此其所以然者蜃氣樓臺之餘烈也大貝海南有大貝圎背而紫斑平面深縫縫之兩旁有横細縷䧟生縫中夲草謂之紫貝亦有小者大如指面其背㣲青大理國以為甲胄之飾且古以貝子為通貨又以為寳器陳之廟朝今南方視之與蚌蛤等古今所尚固不同耶金石門生金廣西所在産生金融宜昭藤江濱與夫山谷皆有之邕州溪峒及安南境皆有金坑其所産多於諸郡邕管永安州與交阯一水之隔爾鵝鴨之屬至交阯水濱逰食而歸者遺糞類得金在吾境水濱則無矣凡金不自礦出自然融結於沙土之中小者如麥麩大者如豆更大如指面皆謂之生金昔江南遺趙韓王𤓰子金即此物也亦有大如鷄子者謂之金母得是者富固可知交阯金坑之利遂買吾民為奴今峒官之家以大斛盛金鎮宅博賽之戯一擲以金一杓為注其豪侈如此則其以金交結内外何所不可為矣古人欲使黄金與土同價者知夲之言也丹砂水銀昔葛稚川為丹砂求為勾漏令以為仙藥在是故也勾漏今容州則知廣西丹砂非他地可比夲草金石部以湖北辰州所産為佳雖今世亦貴之今辰砂乃出沅州其色與廣西宜州所産相類色鮮紅而微紫與邕砂之深紫㣲黒者大異功效亦相懸絶盖宜山即辰山之陽故也雖然宜辰丹砂雖良要非仙藥葛稚川不求此也嘗聞邕州右江溪峒歸徳州大秀墟有金纒砂大如箭鏃而上有金線縷文乃真仙藥得其道者可用以變化形質試取以煉水銀乃見其異盖邕州燒水銀當砂十二三斤可燒成十斤其良者十斤真得十斤惟金纒砂八斤可得十斤不知此砂一經火力形質乃重何哉是砂也取毫末而齒之色如鮮血誠非辰宜可及邕州溪峒砂發之年中夜望之隐然火光滿山嗟夫稚川知之矣煉水銀邕人煉丹砂為水銀以鐡為上下釜上釜盛砂隔以細眼鐡板下釜盛水埋諸地合二釜之口於地面而封固之灼以熾火丹砂得火化為霏霧得水配合轉而下墜遂成水銀然則水銀即丹砂也丹砂禀生成之性有隂陽之用能以獨體化為二體此其所以為聖也然丹經乃有真汞何哉余以為丹砂燒成水銀故已非真汞邕州右江溪峒歸徳州大秀墟有一丹穴真汞出焉穴中有一石壁人先鑿竅方二三寸許以一藥塗之有頃真汞自然滴出毎取不過半兩許所塗之藥今忘其名矣是色紅粉與水銀白青之色殊異其倍亦重於水銀嗟夫學仙得此其至寳歟銀朱桂人燒水銀為銀朱以鐡為上下釜下釜如盤盂中置水銀上釜如盖頂施竅管其管上屈曲垂於外二釜函盖相得固臍既宻則别以水浸曲管之口以火灼下釜之底水銀得火則飛遇水則止火熯體乾白變而丹矣其上曰頭朱次曰次朱次者不免雜以黄丹也銅史稱駱越多銅銀交州記曰越人鑄銅為舶廣州記曰俚獠鑄銅鼓聞交阯及占城等國王所居以銅為瓦信知南方多銅矣今邕州有銅固無幾而右江溪峒之外有一蠻峒銅所自出也掘地數尺即有礦故蠻人多用銅器嘗有獻説於朝欲與博易事下夲路諸司謂且生邊釁奏罷之銅綠綠所在有之湖南之衡永廣東之韶廣西之邕皆有之蓋銅之苖裔也有融結於山巖翠綠可愛玩質如石者名石綠色鮮美淘取英華以共畫繪其次可飾棟宇又一種脆爛如碎土者名泥綠人不甚用鉛粉西融州有鉛坑鉛質極美桂人用以制粉澄之以桂水之清故桂粉聲聞天下桂粉舊皆僧房罨造僧無不富邪僻之行多矣厥後經略司專其利嵗得息錢二萬緡以資經費羣僧乃徃衡嶽造粉而以下價售之亦名桂粉雖其色不若桂然桂以故發賣少遲鍾乳静江多巖洞深者數里崗穴之中或髙不可踰或下不可隧石脉滴水風所不及悉成鍾乳風之所及雖曰結乳色乃麤黄不甚入藥鍾乳之産也乳床連延乳管倒垂漸鋭而長滴瀝未巳冰筯成列長者一二尺短者四五寸人以竹管仰挿而折取之煮以七復之重湯硏以三旬之玉槌試之肌紋以觀其細澄之灰池而亁其體日以烜之其色㣲輕紅真者細妙服之刀圭淪肌浹髓凡乳通如鵝管中無鴈齒或破如爪甲文如蝉翼者上也夲草所謂石鍾乳是也管無梢連石床者商孽也乳牀之石明潔如玉者孔公孽也三物夲同種夲草以石鍾乳居玉石上秩商孽孔公孽皆在中秩其功用必有優劣爾今廣西帥司所造鍾乳粉率二孽也所謂鵝管石盖什之一二耳鍾乳所産亦自有異有石乳有竹乳有茅乳石乳者生於石山石液相滋化而為乳色如冰玉是為最良竹乳者生於土石山洞其上生竹竹石相滋液化為乳其色稍青茅乳者生於土石山洞其上生茅茅液相滋化而為乳其色㣲黄皆可煮煉以為温藥未煉之乳體性皆寒且有石毒惟假湯火之功去其毒性乃能廢寒為温以成上藥今本草註家謂石乳温竹乳平茅乳寒此説恐未必然産乳之穴雖曰深逺未嘗有蛇虺居之夲草註家又謂深潤幽穴龍蛇毒氣所成斯大謬矣凡煮煉乳水人或誤飲能使人失音其毒如此滑石静江猺峒中出滑石今本草所謂桂州滑石是也滑石在土其爛如泥出土遇風則堅白者如玉黒如蒼玉或琢為器用而潤之以油似與玉無辨者他路州軍頗愛重之桂人視之如土織布粉壁皆用在桂一斤直七八文而巳石鷰石鷰生於石遇雷雨則震躍而出盖陽氣之感今湖南永州所産絶佳色黄而頭觜翅脊了了然廣西象州江濱石中亦有之凡石中有嵌生如海蚶者極多非真石鷰也石蠏石蝦海南州軍海濱之地生石蠏軀殻頭足與夫巨螯宛然蝤蛑之形也又有石蝦亦宛然蝦形皆藥物之所湏也云是海沬所化理不可詰夲草石蠏能療目而石蝦治療未詳石梅石梅生海中一叢數枝横斜瘦硬形色真楛梅也雖巧花工造作所不能及根所附著如覆菌或云夲是朩質為海水所化石栢石栢生海中一幹極細上有一葉宛是側栢扶疎無小異根所附著如烏藥大抵皆化為石矣此與石梅雖未詳可入藥與否然皆竒物也
