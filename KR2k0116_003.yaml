body:
  text: 嶺外代答卷三宋周去非撰外國門下大秦國大秦國者西天諸國之都會大食蕃商所萃之地也其王號麻囉弗以帛織出金字纒頭所坐之物則織以絲罽有城郭居民王所居舍以石灰代瓦多設簾幃四圍開七門置守者各三十人有他國進貢者拜於階戺之下祝壽而退屋下開地道至禮拜堂一里許王少出惟誦經禮佛遇七日即由地道往禮拜堂拜佛從者五十人國人罕識王靣若出遊騎馬打三簷青繖馬頭項皆飾以金玉珠寶遞年大食國王號素丹遣人進貢如國內有警即令大食措置兵甲前來撫定所食之物多飯餅肉不飲酒用金銀器以匙挑之食己即以金盤貯水濯手土産琉璃珊瑚生金花錦縵布紅馬腦真珠天竺國其屬也國有聖水能止風濤若海揚波以琉璃瓶盛水灑之即止大食諸國大食者諸國之總名也有國千餘所知名者特數國耳有麻離拔國廣州自中冬以後發船乘北風去約四十日到地名藍里博買蘇朩白錫長白藤住至次冬再乘東北風六十日順風方到此國産乳香龍涎真珠琉璃犀角象牙珊瑚木香沒藥血竭阿魏蘇合油沒石子薔薇水等貨皆大食諸國至此博易國王官民皆事天官豪各以金線挑花帛纒頭搭項以白越諾金字布為衣或衣諸色錦以紅皮為履居五層樓食麵餅肉酪貧者乃食魚蔬地少稻米所産果實甜而不酸以蒲桃為酒以糖煮香藥為思酥酒以蜜和香藥作眉思打華酒暖補有益以金銀為錢巨舶富商皆聚焉哲宗元祐三年十一月大食麻囉拔國遣人入貢即此麻離拔也有麻嘉國自麻離拔國西去陸行八十餘程乃到此是佛麻霞勿出世之處有佛所居方丈以五色玉結甃成墻屋每歲遇佛忌辰大食諸國王皆遣人持寶貝金銀施捨以錦綺蓋其方丈每年諸國前來就方丈禮拜并他國官豪不拘萬里皆至瞻禮方丈後有佛墓日夜常見霞光人近不得往往皆合眼走過若人臨命終時取墓上土塗胸即乘佛力超生云有白達國係大食諸國之京師也其國王則佛麻霞勿之子孫也大食諸國用兵相侵不敢犯其境以故其國富盛王出張皂蓋金柄其頂有玉獅子背負一大金月耀人目如星遠可見也城市衢陌居民豪侈多寶物珍假皆食餅肉酥酪少魚菜米産金銀碾花上等琉璃白越諾布蘇合油國人皆相尚以好雪布纒頭所謂軟琉璃者國所産也有吉慈尼國皆大山圍繞鑿山為城方二百里環以大水其國有禮拜堂百餘所內一所方十里國人七日一赴堂禮拜謂之除或作厨幭其國産金銀越諾布金絲錦五色駝毛假碾花琉璃蘇合油無名異摩娑石人食餅肉乳酪少魚米民多豪富居樓閣有五七層者多畜牧駝馬地極寒自秋至春雪不消寖近西北故也有眉路骨惇國居七重之城自上古用黑光大石疊就每城相去千步有蕃塔三百餘內一塔高八十丈內有三百六十房人皆纒頭搭項寒即以色毛假為衣以肉麵為食以金銀為錢所謂鮫綃薔薇水梔子花摩娑石鵬砂皆其所産也有勿厮離國其地多名山秋露既降日出照之凝如糖霜採而食之清涼甘腴此真甘露也山有天生樹一歲生粟次歲生沒石子地産火浣有珊瑚木蘭皮國大食國西有巨海海之西有國不可勝數大食巨艦所可至者木蘭皮國爾蓋自大食之陀盤地國發舟正西涉海一百日而至之一舟容數千人舟中有酒食肆機杼之屬言舟之大者莫木蘭若也今人謂木蘭舟得非言其莫大者乎木蘭皮國所産極異麥粒長二寸瓜圍六尺米麥窖地數十年不壞産胡羊高數尺尾大如扇春剖腹取脂數十斤再縫而活不取則羊以肥死其國相傳又陸行二百程日晷長三時秋月西風忽起人獸速就水飲乃生稍遲以渴死西天諸國西方諸國大率冠以西天之名凡數百國最著名者王舍城天竺國中印度蓋佛氏所生故其名重也傳聞其地之東有黑水淤河大海越之而東則西域吐蕃大理交址之境也其地之西有東大食海越之而西則大食諸國也其地之南有洲名曰細蘭國其海亦曰細蘭海昔張騫使大夏聞身毒國在大夏東南一千里余聞自大理國至王舍城亦不過四十程案賈耽皇華四達記云自安南通天竺又達摩之來浮海至番禺此海道可通之明驗也西天南尼華囉國西天南尼華囉國城有三重其人早晚必浴以鬱金塗身靣效佛金色國人多稱婆羅門以為佛真子孫屋壁坐席塗以牛糞家置壇崇三尺三級而升每晨以牛糞塗焚香獻花供養道通西域西域忽有輕騎來劫但閉門距之數日乏糧自退東南海上諸雜國東南海上有沙華公國其人多出大海劫奪得人縛而賣之闍婆又東南有近佛國多野島蠻賊居之號麻囉奴商舶飄至其國擒人以巨竹夾而燒食之賊首鑽齒陷以黃金以人頭為食器其島愈深其賊愈甚又東南有女人國水常東流數年水一泛漲或流出蓮肉長尺餘桃核長二尺人得之則以獻於女王昔常有舶舟飄落其國羣女攜以歸數日無不死有一智者夜盜船亡命得去遂傳其事其國女人遇南風盛發祼而感風咸生女也崑崙層期國西南海上有崑崙層期國連接大海島常有大鵬飛蔽日移晷有野駱駝大鵬遇則吞之或拾鵬翅截其管堪作水桶又有駱駝鶴身項長六七尺有翼能飛但不高耳食雜物炎火或燒赤熱銅鐵與之食及産大象牙犀角又海島多野人身如黑漆拳髮誘以食而擒之動以千萬賣為蕃奴波斯國西南海上波斯國其人肌理甚黑鬢髮皆拳兩手鈐以金串縵身以青花布無城郭其王早朝以虎皮蒙杌疊足坐羣下禮拜出則乘軟兜或騎象從者百餘人執劒呵護食餅肉飯盛以瓷器掬而啖之蛋蠻以舟為室視水如陸浮生江海者蛋也欽之蛋有三一為漁蛋善舉網埀綸二為蠔蛋善沒海取蠔三為木蛋善伐山取材凡蛋極貧衣皆鶉結得掬米妻子共之夫婦居短蓬之下生子乃猥多一舟不下十子兒自能孩其母以軟布束之背上蕩槳自如兒能匍匐則以長繩繫其腰於繩末繫短木焉兒忽墮水則緣繩汲出之兒學行往來蓬脊殊不驚也能行則己能浮沒蛋舟泊岸羣兒聚戲沙中冬夏身無一縷真類獺然蛋之浮生似若浩蕩莫能馴者然亦各有統屬各有界分各有役於官以是知無逃乎天地之間廣州有蛋一種名曰盧停善水戰三伏馱交址之南有山曰播流環數百里若大鐵圍不可攀躋中皆良田唯有一竅可入有種類居之交址所不得而臣號曰三伏馱安南屢欲滅之其人守險萬方不可入三伏馱自言曰縱安南有強兵我自有禾可食蓋謂其不可滅也猺人猺人者言其執徭役於中國也靜江府五縣與猺人接境曰興安靈川臨桂義寧古縣猺人聚落不一最強者曰羅曼猺人麻園猺人其餘曰黃沙曰甲石曰嶺屯曰褒江曰贈腳曰黃村曰赤水曰藍思曰巾江曰竦江曰定花曰冷石坑曰白靣曰黃意曰大利曰小平曰灘頭曰丹江曰縻江曰閃江曰把界山谷彌遠猺人彌多盡𨽻於義寧縣桑江寨猺人椎髻臨額跣足帶械或袒祼或鶉結或斑布𫀆袴或白布巾其酋則青巾紫𫀆婦人上衫下裙斑斕勃窣惟其上衣斑文極細俗所尚也地皆高山而所産乃輜重欲運致之不可肩荷則為大囊貯物以皮為大帶挽之於額而負之於背雖大朩石亦負於背猺人耕山為生以粟豆芋魁充糧其稻田無幾年豐則安居巢穴一或飢饉則四出擾擾土産杉板滑石蜜蠟零陵香燕脂木靜江五縣沿邊唯興安義寧縣官任滿有邊賞西南夷西南五姓蕃部曰龍羅方石張自昔許上京入貢龍羅方石自宜州入境張蕃自雍州入境或三年或四五年計五姓人徒凡九百六十人所貢氊馬丹砂朝廷支賜錦衫銀帶與其他費凡二萬四千四百餘緡回答之物不與焉熙寧八年令五姓蕃五年一進奉納方物於宜州宜州估時價回答又有西南韋蕃亦五年一進奉宜州受其方物回答之費凡一千二百餘緡羈縻州亦有進奉者宜州管下安化三州一鎮舊許三年一上京進奉額二百九十三人後令納方物於宜州思立寨而親赴州領賜西南夷大率椎髻跣足或衣斑花布或披氊而背刀帶弩其髻以白紙縛之云猶為諸葛武侯制服也武侯之烈遠矣哉通道外夷中國通道南蠻必由雍州橫山寨自橫山一程至古天縣一程至歸樂州一程至唐興州一程至暀殿州一程至七源州一程至泗城州一程至古那洞一程至龍安州一程至鳳村山獠渡江一程至上展一程至博文嶺一程至羅扶一程至自杞之境名曰磨巨又三程至自杞國自杞四程至古城郡三程至大理國之境名曰善闡府六程至大理國矣自大理國五程至蒲甘國去西天竺不遠限以淤泥河不通亦或可通但絶險耳凡三十二程若欲至羅殿國亦自橫山寨如初行程至七源州而分道一程至馬樂縣一程至恩化縣一程至羅奪州一程至圍慕州一程至阿姝蠻一程至硃砂蠻一程至順唐府二程至羅殿國矣凡十九程若欲至特磨道亦自橫山一程至上安縣一程至安德州一程至羅博州一程至陽縣一程至隘岸一程至那郎一程至西寧州一程至富州一程至羅拱縣一程至歷水鋪一程至特磨道矣自特磨一程至結也蠻一程至大理界虛一程至最寧府六程而至大理國矣凡二十程所以謂大理欲以馬至中國而北阻自杞南阻特磨者其道里固相若也聞自杞特磨之間有新路直指橫山不涉二國今馬既歲至亦不必由他道也航海外夷今天下沿海州郡自東北而西南其行至欽州止矣沿海州郡類有市舶國家綏懷外夷於泉廣二州置提舉市舶司故凡蕃商急難之欲逃訴者必提舉司也歲十月提舉司大設蕃商而遣之其來也當夏正之後提舉司征其商而覆護焉諸蕃國之富盛多寶貨者莫如大食國其次闍婆國其次三佛齊國其次乃諸國耳三佛齊者諸國海道往來之要衝也三佛齊之來也正北行舟歷上下竺與交洋乃至中國之境其欲至廣者入自屯門欲至泉州者入自甲子門闍婆之來也稍西北行舟過十二子石而與三佛齊海道合於竺嶼之下大食國之來也以小舟運而南行至故臨國易大舟而東行至三佛齊國乃復如三佛齊之入中國其他占城真臘之屬皆近在交址洋之南遠不及三佛齊國闍婆之半而三佛齊闍婆又不及大食國之半也諸蕃國之入中國一歲可以往返唯大食必二年而後可大抵蕃舶風便而行一日千里一遇朔風為禍不測幸泊於吾境猶有保甲之法茍泊外國則人貨俱沒若夫默伽國勿斯里等國其遠也不知其幾萬里矣沿邊兵按此下十二條當另為一門原夲脫去標目祖宗分置將兵廣西得二將焉邊州雍管為上宜次之欽次之融又次之靜江帥府元屯半將二千五百人又駐泊兵二千人效用五百人又殿前摧鋒軍五百人又有雄略忠敢等軍軍容頗盛無事足以鎮撫有事足以調發雍屯全將五千人以三千人分戍橫山太平永平古萬四寨及遷隆鎮其二千人留州更戍宜州屯半將二千五百人乃靜江一將之分屯者高峯帶溪北遐思立鎮寧諸寨之戍乃多用天河思恩河池三縣之土丁而宜州在城與夫溪洞都巡檢兵蓋不滿千人欽之澄海與夫管界沿海二巡檢合集不過五百人而如昔之戍出於洞丁抵棹之戍出於土丁融州舊撥靜江府馬軍二百人都巡檢兵亦不過二三百輩祖宗時以廣右事力綿薄而邊防急切故歲賜錢一百一十餘萬緡而諸郡稅賦以之養兵積威宜有餘裕南渡以來歲賜已絶又歲取廣西鹽鈔錢四十萬緡經總制錢數十萬緡歷年滋久故諸郡銷兵以自足爾土丁戍邊雍欽與交址為境自昔二郡土丁雜官軍戍邊雍州土丁戌邊之事未詳欽之抵棹寨以安遠縣土丁百人更戍季一替厥後宜有南丹莫公晟之擾大觀元年始詔宜州土丁依雍欽例戍邊正兵長戍二百人土丁更戍三百人以天河思恩河池三縣土丁父子全不分畨戍守其間河池一縣最近高峯與南丹對境要害地也而河池一縣土丁正可分為兩畨一季一替乃於腹裏之宜山欣城二縣三丁抽一分為三畨月一替是則宜之土丁其役更重於雍欽也宜之守臣屢請於朝乞差次邊桞象賔橫州土丁與宜之土丁更戍以紓極邊之民不報而宜之戍至今不己洞丁戌邊羈縻州之民謂之洞丁強武可用溪洞之酋以為兵衛謂之田子甲官欲用其一民不可得也唯欽州七洞洞丁為官戍邊蓋七洞權力弱於雍管故聽命也舊制欽洞置巡防使臣一名以官軍百人戍如昔洞以備交址因官軍虐之洞酋乞不用官軍願自以洞丁更戍以故欽州猶有洞丁之戍田子甲雍州溪洞之民無不習戰刀弩鎗牌用之頗精洞民事讐殺是以人習於戰鬭謂之田子甲言耕其田而為之甲士也又朝廷馬政正在其地所謂良馬彼多得之洞豪頗習驍騎洞官出入前驅千人後騎數十整整不亂亦謂之馬前排靖康之變洞兵有勤王者遺老猶能言之曰洞民素儉勤王之役日得劵錢積而不用比歸人有二三百緡之積至今以為美談嘗有官員自儂洞借人夫至欽所從數人道間麋興於前能合而取之鳶飛於天能仰而落之一夕逆旅劫盜人有懼色唯洞人整暇以待盜不敢前昔漢高祖用板楯蠻以取關中武王伐商亦用微盧彭濮人正使今日有疆場之事而用之當必有功洞丁雍州左右江提舉洞丁與夫經略司買馬幹官兼提舉皆此職也熙寧中係籍洞丁四萬餘人今其籍不可考矣官名提舉實不得管一丁而生殺豫奪盡出其酋欽州洞丁雖不如雍管之己甚所以奉其酋者亦類此嘗聞道家有言人罪重者謫為邊民罔有藝極洞丁日各以職供水陸之産為之力作終歲而不得一飽為之效死戰爭而復加科斂一有微過遣所親羣斬之上流而身於下流閲其尸也日曛酋醉酣杖劒散步洞丁避不及者手刃焉類以此為服人之威何其酷也寨丁環羈縻溪洞置寨以臨之皆吾民也謂之寨丁靜江府有桑江寨融州有融州寨武陽寨與潯江文材茶溪臨溪四堡宜州有高峯寨帶溪寨北遐寨思立寨鎮寧寨雍州有橫山寨溫潤寨太平寨永平寨古萬寨遷隆鎮欽州有如昔寨抵棹寨瓊州有寶西寨西峯寨延德寨萬安軍有萬全寨吉陽軍有通遠寨凡諸寨之戍或用官軍或洞丁或寨丁寨官或巡防使臣或都監或知寨或一寨有長二官屬是皆係乎寨之大小也諸寨行事動關化外法制不得不少寬威權不得不稍重夫諸寨逈居於諸洞之中寨丁更戍不下百人彼寨之境山谷阻深異材生之今邊境晏然亦未免有採山之役土丁保丁自儂智高平朝廷聯一路之民以為兵户滿五丁者以一為土丁二丁者以一為保丁熙寧六年詔依河北義勇例修立條制如禁軍置都虞候以下六階以𨽻之因其民之資序而為之階級專屬經略司調發其保丁則𨽻於州縣而以保正統之八年廣西諸司乞以土丁教閲今保丁亦教閲也每歲農隙會土保丁越州若縣教以坐作進退號令旗鼓之法一季而罷立法之意蓋以廣民雕弱人無固志若素教其民一旦有警則百萬之師可以遽集今乃州縣私役於教閲之餘寖失初意然有不可不役者廣西城壁皆以土為周覆以屋一歲不葺多致腐壓為郡將者先盡教閲之道以體立法之意乃約城屋當用之工分部竭作不容私役旬月集事即日散之民亦樂從而不以為勞矣效用廣右效用蓋諸郡山川廣莫生齒不蕃強弱不侔又四方之姦民萃焉於是諸郡所在假強武之民以效用名之豪民亦借官為重自王宣凌鐵謝實為變賴效用立功厥後經略司乃置效用五百人於靜江凡強盜貸死逃卒亡命與其強武願從之民咸集焉善接短刃以蹙賊隱然形勢有足取者靜江效用自成一軍若乃諸郡效用散在民間猶存而不廢土宣廣西郡兵卒歲有押馬綱賞纍至受宣押馬往來販賣至多資亦有纍賞補官者厥後朝廷減賞只許轉至十將不許受宣於是邊州守臣便宜出帖補副都虞候謂之土宣其間亦有以私恩不令陟階級而輔副都虞候者雖不請厚祿而為排軍矣五民欽民有五種一曰土人自昔駱越種類也居於村落容貌鄙野以唇舌雜為音聲殊不可曉謂之蔞語二曰北人語言平易而雜以南音本西北流民自五代之亂占籍於欽者也三曰俚人史稱俚獠者是也此種自蠻洞出居專事妖怪若禽獸然語音尤不可曉四曰射耕人本福建人射地而耕也子孫盡閩音五曰蛋人以舟為室浮海而生語似福廣雜以廣東西之音蛋别有記惰農深廣曠土彌望田家所耕百之一爾必水泉冬夏常注之地然後為田茍膚寸高仰皆棄而不顧其耕也僅取破塊不復深易乃就田點種更不移秧既種之後旱不求水潦不疏決既無糞壤又不耔耘一任於天既穫則束手坐食以卒歲其妻乃負販以贍之已則抱子嬉遊慵惰莫甚焉彼廣人皆半羸長病一日力作明日必病或至死耳僧道南中州縣有寺觀而無僧道人貧不能得度牒有祠部牒者無幾餘皆童行以供應聖節為名判公慿於州縣權行剃髮戴冠遂為真僧道如出公據其説謂被盜遭火失去度牒官為給據為慿遂以剃戴
