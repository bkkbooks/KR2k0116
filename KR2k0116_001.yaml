body:
  text: 嶺外代答卷一宋周去非撰地理門百粵故地自秦皇帝并天下伐山通道略定揚粵為南海桂林象郡今之西廣秦桂林是也東廣南海也交址象郡也漢武帝平南海離秦桂林為二郡曰鬱林蒼梧離象郡為三曰交址九真日南又稍割南海象郡之餘壤為合浦郡乃自徐聞渡海略取海南為朱崖儋耳二郡置刺史于交州漢分九郡視秦若多其統之則一交州刺史耳至吳始分為二於是交廣之名立焉時交治龍編廣治番禺唐太宗分天下為十道合交廣為一置採訪使于番禺其規模猶漢時唯帥府易地也髙宗始置安南都護府于交州本朝皇祐中置安撫經略使于桂州西道帥府始於此至今八桂番禺龍編鼎峙而立復秦之故云並邉廣西西南一方皆迫化外令甲雍宜欽廉融瓊州吉陽萬安昌化軍靜江府係沿邉栁賔貴橫鬱林化雷係次邉總廣西二十五州而邉州十七靜江屬縣半抵猺洞猺洞者五陵蠻之别也自靜江稍西南曰融州其境控扼王江樂善冝良丈盈洪源從允牂牱夜郎諸蠻自融稍西南曰宜州宜處羣蠻之腹有南丹州安化三州一鎮荔波羸河五洞茅灘撫水諸蠻南丹者所謂莫大王者也自宜稍西南曰雍州雍境極廣管溪洞羈縻州縣洞數十右江直西南其外則南詔也左江直正南其外則安南也自雍稍東南曰欽州欽之西南接境交址陸則限以七洞水則舟楫日通自欽稍東曰亷州亷之海直通交址自亷東南渡海曰瓊州萬安昌化吉陽軍中有黎母山環山有熟黎生黎若夫浮海而南近則占城諸蕃逺則接于六合之外矣廣西省併州廣西地帶蠻夷山川曠逺人物稀少事力微薄一郡不當浙郡一縣異時偏方割據境土褊小故並建荒為州縣而務觀美逮夫正統有歸六合混一乃省併晏州荔州今靜江府荔浦縣是也龍州今栁州龍城縣是也燕州今藤州鐔津縣是也皆廢於唐之貞觀溥州今靜江府興安縣也廢於本朝之乾德嚴州今象州之來賔縣也澄州今賔州上林縣也蠻州今橫州永淳縣也牢州黨州今鬱林州南流縣也南儀州今藤州岑溪縣也繡州今容州普寧縣也禺州北流縣也順州陸川縣也潘州今髙州茂名縣也南亭州玉州今欽州靈山縣也薑州今亷州合浦縣也皆廢於開寶珠州今融州融水縣也鎮寧州今宜州帶溪寨也竇州今髙州信宜縣也蒙州今昭州立山縣也皆廢於熙寧龔州今潯州平南縣也平州今融州懷逺縣也白州今鬱林州博白縣也觀州今宜州髙峯寨也溪州馴州敘州今宜州北遐鎮思立寨也皆廢於紹興夫州大矣廢而為縣若寨又不加大焉又有不専縣寨者顧有廢二州而僅成一縣且或為鎮寨或廢一州而併入近縣者然則昔之為州無乃強名乎五嶺自秦世有五嶺之説皆指山名之考之乃入嶺之途五耳非必山也自福建之汀入廣東之循梅一也自江西之南安踰大庾入南雄二也自湖南之郴入連三也自道入廣西之賀四也自全入靜江五也乃若漳潮一路非古入嶺之驛不當備五嶺之數桂林城北二里有一丘髙數尺植碑其上曰桂嶺及訪其實乃賀州實有桂嶺縣正為入嶺之驛全桂之間皆是平陸初無所謂嶺者正秦漢用師南越所由之道桂嶺當在臨賀而全桂之間實五嶺之一途也湖廣諸山南方多佳山竊謂其本根自衡山來勢如朩之有餘枝條枚也東南一幹為廣東之韶石雲闕參天鐘簴躆地望之使人肅然想有虞張樂之盛綿延至英州羣峯玉立堅潤而秀乃其枝柯也𣪚布為德慶之三洲巖惠之羅浮山與其他不知名之竒山又其條枚也西南一幹發為道之九嶷峥嶸峻極峯岫挺異縈紆盤礴惘不可測綿延為桂林之山羣峯拔地森立四野亦皆其枝柯也至伏地而行乎黃茅赤土之下突出為西融州之老君洞天容之勾漏洞天潯之白石洞天兹亦其條枚也東南方至陽天地之美具焉草朩之生必向榮於南枝衡山之陽亦猶是耳桂山山谷詩云桂嶺連城如鴈蕩平地蒼玉忽嵯峨唐人謂兩地不如陽朔好碧蓮峯裏住人家鴈山屢遊矣桂山得鴈山之秀鴈山不若桂山之多若置諸大龍湫龍鼻泉之側則雄偉之氣亡矣桂山之髙曽不及鴈山之半故無尊雄之勢謂可與相頡頏者過矣乃若陽朔諸山唯新林鋪左右十里內極可賞愛青山緑水團欒映帶煙霏不斂空翠撲人面面相屬人住其間真住蓮花心也桂林負郭諸山頗不及耳夫其尖翠特立無不拔地而起綿延數百里望之不見首尾亦云盛哉桂林巖洞石湖嘗評桂山之竒宜為天下第一及考唐韓退之詩云水作青羅帶山如碧玉篸栁子厚訾家洲記云桂州多靈山發地峭竪林立四野觀前人品題桂林之意端不誣矣山皆中空故峯下多佳巖洞神刓鬼刻髙者憑崖如化城下者穿隧若水府大者可建五丈旗小者猶可容十客或浮為洲渚或內通舟楫去城不過七八里近二三里几杖間可以遍覽巖穴有名可紀者三十餘所今述于後巖則曰讀書曰疊綵曰伏波曰龍隱曰劉仙曰屏風曰佛子曰雉巖洞則曰白龍曰華景曰水月曰龍隱曰棲霞曰元風曰曽公曰南濳曰北濳曰隱山六洞曰虛秀曰石乳峯則曰立魚曰獨秀其他不可枚數矣按范成大桂海虞衡志所載巖洞與此同惟白龍乃洞名龍隱則巖洞俱有又有虛秀無靈秀此本舊有錯悮今俱改正靈巖洞穴有水然後稱竒桂林諸洞無慮百所率近在城外數里俱有可觀若水東之曾公巖興安之石乳洞皆有流水自洞而出施直橋橫檻其上遨遊者得以徙倚其間異於他洞者空明幽邃而巳雖然未若城南之水月洞東江之龍隱巖也水月中通形如半規江流貫之中有石橋可以觴客龍隱修曲而髙明江流貫之鼓棹而入仰視洞頂夭矯乎真龍之脊脅也范石湖謂二洞竒賞絶世融州老君洞亦通川流中有小洲其旁髙岑有乳石滴成老君之形鬚眉衣冠無一不具張于湖榜曰天下第一真仙之洞以是知凡洞必以川流為貴也雖然二賢所賞水深數尺廣才丈餘耳若夫桂之靈川縣有靈巖者二賢未知也是巖也大江洞其腹水闊二十丈深當倍之余嘗攝邑靈川天久不雨往禱于巖方舟造洞遙望大江平濶直抵山根橫有一線之光邇而望之乃知洞穴表裏明徹而然也即其洞口水面阽阽正將枕山不可得入者舟子擊水伏而進仰視洞頂與水面相去才丈餘水與洞頂皆平如掌舟入漸深楫聲隱隱震動固巳駭人心目人聲一發山水皆應大音叱吒洞虛裂當巖之中洞頂穹窿如寶蓋然其下即神龍所居也余斂板焚香巫者以修綆下瓶汲深奉之以歸輒有感應是江也西通猺洞日寫良材貫巖而下水深不可施篙撑拄巖頂而後得出余求之事實謂此江古來繞出山外忽雷雨數日神龍穿破山腹以定窟宅遂命曰靈巖縣曰靈川亦以是得名今洞旁山觜尚有故江迹存噫此巖水色沉碧雄深嚴靜人至其間若有神靈左右之者誠非遊觀之地去城三十里不若諸洞之邇於人所以未蒙賞音惜哉羅叢巖羅叢巖在潯州西南六十里巖中明快可容數百人每遇重九合鄰郡之人而集焉以為登髙之樂巖內有三聖殿殿側有石鐘其大合抱自然天成殿東則有碧虛洞由石穴而入通行平坦其屈曲約半里餘出于巖之東洞內則有石佛石磬石獅子石牀石鐘殿西則有靈源洞由石穴而入通行平坦其屈曲約一二里出于巖之西洞內則有石羅漢石象石馬石魚石筍石鼓凡遊兩洞者必秉火炬以觀聮巖之外西則有水月巖約深數丈約闊十五丈泉源清徹四時不涸中有異魚存焉巖口則有龍王殿入巖中則有觀音堂或遇嵗旱里人禱之甘雨必應由大巖之中皆用石板平砌而出巖門則有鐘樓樓之西倚巖則以石甃髙數丈為方丈樓之外則有三門門之外則有超然亭亭之左右則有石板為路連袤一二里四圍皆植松竹實潯之勝槩云黎母山海南四州軍中有黎母山其山之水分流四郡熟黎所居半險半易生黎之處則巳阻深然皆環黎母山居耳若黎母山巔數百里常在雲霧之上雖黎人亦不可至也秋晴清澄或見尖翠浮空下積鴻濛其上之人夀考逸樂不接人世人欲窮其髙往往迷不知津而虎豹守險無路可攀但見水泉甘美耳此豈蜀之菊花潭老人村之類耶廣西水經凡廣西諸水無不自蠻夷中來靜江水曰灕水其源雖自湘水來然湘本北行秦史祿決為支渠南注之融江而融江實自猺洞來漢武帝平南越發零陵下灕水蓋泝湘而上沿支渠而下入融江而南也灕水自桂歷昭而至蒼梧融州之水牂牱江是也其源自西南夷中來武帝發夜郎下牂牱即出此也宜州之水自南丹州合集諸蠻溪谷而來東合于牂牱歷栁歷象而至潯雍州之水其源有二一為左江自交址來一為右江自大理國戚楚府大槃水來江合于雍歷橫歷貴與牂牱合于潯而東行歷藤而與灕水合于蒼梧蒼梧者諸水之所會名曰三江口實南越之上流也水自是安行入于南海矣牂牱江西融州城外江水即牂牱江之下流也江面頗闊昔嘗有大水泛出蜀南州牌漢武平南越發夜郎下牂牱非由融州則何自而至南越哉今靜江府桑江寨其水亦合于融江之上流或云桑江亦牂牱音之訛也大抵融州之西為蜀之南地本連接但隔於蠻猺不可通耳靈渠湘水之源本北出湖南融江本南入廣西其間地勢最髙者靜江府之興安縣也昔始皇帝南戌五嶺史祿於湘源上流灕水一派鑿渠踰興安而南注于融以便於運餉蓋北水南流北舟踰嶺可以為難矣祿之鑿渠也於上流砂磧中疊石作鏵觜鋭其前逆分湘水為兩依山築堤為溜渠巧激十里而至平陸遂鑿渠繞山曲凡行六十里乃至融江而俱南今桂水名灕者言離湘之一派而來也曰湘曰灕往往行人於此銷魂自鏵觜分水入渠循堤而行二里許有泄水灘茍無此灘則春水怒生勢能害堤而水不南以有灘殺水猛勢故堤不壞而渠得以溜湘餘水緩逹于融可以為巧矣渠水繞迤興安縣民田賴之深不數尺廣可二丈足泛千斛之舟渠內置斗門三十有六每舟入一斗門則復閘之俟水積而舟以漸進故能循崖而上建瓴而下以通南北之舟楫嘗觀祿之遺迹竊嘆始皇之猜忍其餘威能罔水行舟萬世之下乃賴之豈唯始皇祿亦人傑矣因名曰靈渠癸水灕水自癸方來直抵靜江府城東北角遂並城東而南古記云賴有癸水繞東城永不見刀兵又有石記云湘南南粵北此地居然自牛肋直饒四面血成池一騎刀兵入不得五代靖康之亂大盜滿四方獨不至靜江風水之説固有驗矣昔於城東北角溝灕水繞城而西復南東合于灕厥後居民壅之溝遂廢范石湖帥桂乃浚斯溝漣漪如帶於溝口伏波巖之下八桂堂之前創為危亭名以癸水此溝未廢桂人屢有登科既廢二十年間幾類天荒石湖以淳熙甲午復溝乙未科果有蔣汝霖戊戌科有蔣來叟辛丑科二人登科今石湖癸水亭記但言癸水之為樂土福地耳復溝之效未續論也龍門潯象之間有龍門春水大至鱘鰉大魚自海逆流而上漁師於龍門之下廽瀾之中設網橫江舉而得之有嘲之者曰是殆南選之龍門也蒼梧上流亦有龍門灘其形勢甚可畏象山象州郡治西樓正面西山山腹忽起白雲狀如白象移時不滅然不可常見案秦象郡乃交址非象州也今象州城門乃畫一白象不審何義然象州自昔不遭兵革凡有大盜皆相戒以不宜犯象鼻然則城門之畫象豈謂此耶天威遙欽之士人曾果得唐人天威遙碑文義駢儷誠唐文也碑旨言安南靜海軍地皆濱海海有三險巨石屹立鯨波觸之晝夜震􅍅漕運之舟涉深海以避之少為風引遵崖而行必瓦碎折三險之下而陸有川遙頑石梗斷焉伏波嘗加功力迄不克就厥後守臣屢欲開鑿以便漕運錐钁一下火光煜然髙駢節度安南齋戒禱祠將施功焉一夕大雨震電于石所者纍日人自分淪沒矣既霽則頑石破碎水深丈餘旁有一石猶存未可通舟駢又虔禱俄復大雨震電悉碎餘石遂成巨川自是舟運無艱名之曰天威遙退而求諸傳載天威遙事略同但不若是詳爾天分遙欽江南入海凡七十二折南人謂水一折為遙故有七十二遙之名七十二遙中有水分為二川其一西南入交址海其一東南入瓊亷海名曰天分遙人云五州昔與交址定界于此言若天分然也今交址於天分遙巳自占又於境界數百餘里吳婆竈之東以立界標而採捕其下欽人舟楫少至焉三合流海南四郡之西南其大海曰交址洋中有三合流波頭濆湧而分流為三其一南流通道于諸蕃國之海也其一北流廣東福建江浙之海也其一東流入于無際所謂東大洋海也南舶往來必衝三流之中得風一息可濟茍入險無風舟不可出必瓦解於三流之中傳聞東大洋海有長砂石塘數萬里尾閭所泄淪入九幽昔嘗有舶舟為大西風所引至于東大海尾閭之聲震􅍅無地俄得大東風以免象鼻砂欽亷海中有砂磧長數百里在欽境烏雷廟前直入大海形若象鼻故以得名是砂也隱在波中深不數尺海舶遇之輒碎去岸數里其磧乃濶數丈以通風帆不然欽殆不得而水運矣嘗聞之舶啇曰自廣州而東其海易行自廣州而西其海難行自欽廉而西則尤為難行蓋福建兩浙濱海多港忽遇惡風則急投近港若廣西海岸皆砂土無多港澳暴風卒起無所逃匿至於欽亷之西南海多巨石尤為難行觀欽之象鼻其端倪已見矣天涯海角欽州有天涯亭亷州有海角亭二郡蓋南轅窮途也欽逺於亷則天涯之名甚於海角之可悲矣斯亭並城之東地勢頗髙下臨大江可以觀覽昔余襄公守欽為直釣軒於亭之東偏即江濱之三石命曰釣石醉石卧石富為吟詠載在篇什潮江浙之潮自有定候欽亷則朔望大潮謂之先水日止一潮二弦小潮謂之子水頃刻竟落未嘗再長瓊海之潮半月東流半月西流潮之大小隨長短星初不係月之盛衰豈不異哉邉帥門廣西經略安撫使漢帥府在交州唐在廣州天寶中嶺南桂容雍交與廣咸屬廣州採訪昭宗始升桂管為節度本朝皇祐中儂智髙平詔狄青分廣西雍宜融為三路用武臣充知州兼本路安撫都監而制經略安撫使于桂州選兩制以上官為知州兼領使事於是八桂遂為西路雄府矣厥後罷雍宜融為郡宜融州守臣兼本路兵馬都監雍守兼本路安撫都監沿邉守臣並帶溪洞都巡檢使盡𨽻于經略安撫使帥府既內兼西南數十州之重外鎮夷蠻幾數百族事權不得不重矣廣西諸郡凡有邉事不申憲漕唯申經略司此昔日陕西制也瓊州兼廣西路安撫都監漢武帝斬南越遣使自徐聞渡海略地置珠崖儋耳二郡今雷州徐聞縣遞角場直對瓊管一帆濟海半日可到即其所由之道也元帝時以海道閉絶棄之梁復置崖州隋時領縣十是時海南止一州耳唐貞觀五年置瓊州今瓊管靖海軍節度是也武德五年置儋州今昌化軍龍朔二年置萬安州今萬安軍武德五年置振州後改曰崖州今吉陽軍四州軍乃海上一洲耳中有黎母大山四州軍環處其四隅地方千里路如連環欲歷其地非一月不可遍瓊管再渡海至吉陽所謂再涉鯨波者也夫廣西去朝廷固逺矣海外州軍又加逺焉不得不置小帥以臨之瓊守權能擲發四州軍官吏今兼本路安撫都監提轄海外逐州軍公事良以此也雍州兼廣西路安撫都監自唐分天下為十道二廣不分東西天寶中始置雍州經略使懿宗始升雍管為西道節度使本朝皇祐中儂智髙平詔狄青分廣雍宜融為三路守臣兼本路兵馬都監而置經略安撫使于桂州以統之今雍守兼本路安撫都監州為建武軍節度有左右兩江左江在其南外抵安南國右江在西南外抵六詔諸蠻兩江之間管羈縻州洞六十餘用為內地藩而內宿全將五千人以鎮之凡安南國及六詔諸蠻有疆場之事必由雍以逹而經略安撫之咨詢邉事亦唯雍是賴朝廷南方馬政專在雍邉方珍異多聚雍矣宜州兼廣西路兵馬都監廣西控扼夷蠻雍屯全將宜屯半將本朝皇祐間分宜州為一路帥所統多夷州後罷為郡今守臣猶兼廣西都監為慶逺軍節度宜之西境有南丹州安化三州一鎮又有撫水五洞龍河茅灘荔波等蠻及陸家寨其外有龍羅方石張五姓謂之淺蠻又有西南韋蕃及蘇綺羅坐夜回按桂海虞衡志作面計利流求謂之生蠻其外又有羅殿毗那大蠻皆有徑路直抵宜城宜之境上舊有觀溪馴敘四州乃昔之邉也權力弱不足以為邉紹興四年罷為寨今宜有髙峯帶溪北遐思立鎮寧五寨是也髙峯一寨古之觀州正抵南丹其或犯邉髙峯則其咽喉宜之府庫月支南丹安化諸洞錢米鹽料有差融州兼廣西路兵馬都監大觀初置融州為黔南經略使所管皆夷州帥府地狹割栁之栁城宜之天河桂之古縣以益之厥後罷融為郡三縣復仍其舊至今黔南帥司官屬朱記在靜江府軍資庫融州城下江即牂牱江也江之上流與王江合王江之間羣猺居之又其上流羣蠻居之猺即五陵溪之别也蠻則諸葛亮所征漢武帝所開者也在融則外置列寨以備之融守兼廣西都監為清逺軍節度每嵗聖節蠻酋赴宴頗多舊日帥府規模尚可覩矣欽亷溪洞都巡檢使欽亷皆號極邉去安南境不相逺異時安南舟楫多至後為溺舟乃更來欽今亷州不管溪洞猶帶溪洞職事者蓋為安南備爾亷之西欽也欽之西安南也交人之來率用小舟既出港遵崖而行不半里即入欽港正使至亷必越欽港亂流之際風濤多惡交人之至欽也自其境永安州朝發暮到欽於港口置抵棹寨以誰何之近境有朩龍渡以節之沿海巡檢一司迎且送之此其備諸海道者也若乃陸境則有七洞於如昔洞置戍以固吾圉
