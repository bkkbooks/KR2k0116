body:
  text: 嶺外代答地理類八雜記之屬提要臣等謹案嶺外代答十巻宋周去非撰去非字直夫永嘉人隆興癸未進士淳熙中官桂林通判是書即作於桂林代歸之後自序謂本范成大桂海虞衡志而益以耳目所見聞録存二百九十四條盖因有問嶺外事者倦於應酬書此示之故曰代答原本分二十門今有標題者凡十九門一門存其子目而佚其總綱所言則軍制戸籍之事也其書條分縷晰視嵇含劉恂段公路諸書叙述為詳所紀西南諸夷多據當時譯者之詞音字未免舛訛而邊帥法制財計諸門實足補正史所未備不但紀土風物産徒為談助巳也書録解題及宋史藝文志並作十巻永樂大典所載併為二巻蓋非其舊今從原目仍析為十巻云乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書嶺外代答目錄巻一地里邉帥巻二外國上巻三外國下一門原脫標題巻四風土法制巻五財計巻六器用服用食用巻七香樂器寳貨金石巻八花朩巻九禽獸卷十蟲魚古跡蠻俗志異嶺外代答原序入國問俗禮也矧甞仕焉而不能舉其要廣右二十五郡俗多夷風而疆以戎索海北郡二十有一其列于西南方者蜿蜒若長蛇實與夷中六詔安南為境海之南郡又内包黎獠逺接黄支之外僕試尉桂林分教寜越盖長邉首尾之邦疆場之事經國之具荒忽誕漫之俗瑰詭譎怪之産耳目所治與得諸學士大夫之緒談者亦云廣矣盖甞随事筆記得四百餘條秩滿束擔東歸邂逅與他書棄遺置勿復稱也迺親故相勞苦問以絶域事驟莫知所對者盖數數然至觸事而談或能舉其一二事類多而臆得者浸廣晚得范石湖桂海虞衡志又於藥裹得所抄名數因次序之凡二百九十四條應酬倦矣有復僕問用以代答雖然異時訓方氏其將有考於斯淳熈戊戌冬十月五日永嘉周去非直夫記
