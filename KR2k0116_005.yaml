body:
  text: 嶺外代答卷五宋周去非撰財計門廣右􅒩計今日廣右􅒩計在鹽而巳鹽場濵海以舟運於廉州石康倉客販西鹽者自廉州陸運至鬱林州而後可以舟運斤兩重於東鹽而商人猶艱之自改行官賣運使姚孝資頤仲實當是任乃置十萬倉于鬱林州官以牛車自廉州石康倉運鹽貯之庶一水可散于諸州凡請鹽之州曰靜江府融宜雍賔橫栁象貴鬱林昭賀梧藤潯容州各以歲額來請靜江歲額八千籮融二千七百籮宜四千三百九十雍七千五百賔二千五百栁三千五百有竒象三千橫二千七百貴三千一百有竒鬱林三千昭三千九百賀五千梧二千藤二千五百潯三千容三千凡五萬八千二百籮有竒按此文原本有錯簡今移正取其息以八分歸漕司二分歸本州又海南四州軍及欽廉雷化高皆産鹽州軍昔賣漕司二分鹽亦以八分息歸漕司通前十六州請鹽于十萬倉者凡七萬餘籮絶長補短漕司歲得錢六十五萬五千六百餘緡而歲支錢七十三萬二千餘緡又以向者存留鹽本錢充之每籮八百足七萬餘籮當得七萬餘緡省以充漕計厥後張南軒為帥乃請于朝以三分鹽息豫諸州而免諸州民户苖米每一石取二斗之耗後以諸郡實賣數奏請其額稍減廣西鹽法廣西土瘠民貧並邉多寇自儂智高平朝廷歲賜湖北衣絹四萬二千匹湖南絁一萬五千匹綿一萬兩廣東米一萬二千石提鹽司鹽一千五百斤韶州涔水場銅五十萬斤付本路鑄錢一十五萬緡總計諸處贍給廣西凡一百一十餘萬緡祖宗蓋以廣右西南二邉接近化外養兵積威不可不素具故使常有餘力也自南渡以來廣西以鹽自給宣和五年巳詔廣東西路各置提舉官歲賣鹽固無定額至是漕司乃得取其贏餘紹興八年詔二廣鹽通行客鈔專置提舉一員于廣州盡領兩路鹽事又以西路逺濶又令廣西提刑兼領西路鹽事時楊么擾洞庭淮鹽不通於湖湘故廣西鹽得以越界一歲賣及八萬籮每籮一百斤朝廷遂為歲額每一籮鈔錢五緡歲得四十萬緡歸于大農內有八萬四千四百緡付廣西經略司買馬三萬緡應副湖北靖州十萬緡以贍鄂州大軍餘悉上供於是漕計大絀無以備邉乃取諸郡民間稅米等第撥往邉州輸納别以錢和糴充諸郡歲計每一石為錢五百足邉州宿兵歲餉二十三萬二千餘石而邉州止管稅米一十一萬九千餘石故不免科撥他郡至紹興十一年民以病告乞將支移邉州米就本州納錢漕司上請從之每石折錢四緡足盡貯于漕司辛字庫用以支付邉州漕計大優議者謂邉郡米一石價止數百錢遂裁減至二緡而漕計猶有餘也時淮鹽巳通於湖湘客鈔遂不登額提刑兼司極力招誘歲止賣及五萬籮言事者又謂客鈔既不登額不若復令漕司自賣官鹽而除民折米和糴之擾於是廣西漕臣復領本路鹽事而東鹽不得入西路矣廣東鹽額大虧屢請于朝乞復通客鈔以為廣東産鹽多而食鹽少廣西産鹽少而食鹽多東鹽入西散往諸州有一水之便西路産鹽之州水陸不便異時西路客人樂請東鹽占額為多今西路以鹽利自專則東鹽坐虧課額朝廷從其請又為廣西畫所以為歲計者曰舊額廣東十萬籮廣西八萬籮增收鈔錢一緡省可得一十八萬緡省謂之漕計錢舊法廣西鹽户納鹽一籮官支本錢一千八百足後為官吏侵刻止支二三百今實支一千足官截取八百足謂之存留鹽本錢計西路八萬籮又得八萬二千緡省而西路元額八萬籮客人入納四十萬緡省如是則通可得六十六萬二千緡盡付廣西漕司內取二十餘萬緡充買馬并鄂靖州之費餘四十五萬餘緡以之充廣西歲計廣西舊額八萬籮止及五萬今遂指為實賣之數又於上收增鈔錢減刻鹽本錢是以虛數較之實數歲當虧錢二十一萬六千緡此豈細事也哉范石湖作帥抗疏請復官賣其説曰官自賣鹽不過奪商人之利以利官而民無折米之患往日西路賣及八萬籮今為虛數矣只於實賣及五萬籮為率而權以廣西鹽價每一斤以一百四十文足為率歲可得七十餘萬緡足計九十餘萬緡省霈乎其有餘矣其道約而易行其説簡而易明嚴抑配之法杜侵欺之弊俾法久而不壞誠長利也朝廷始疑而後從之廣東申乞不巳又為東路歲認發東鹽入界鈔錢之數二萬四千六百餘緡其議遂定然漕計優裕實范公之力也經略司買馬自元豐間廣西帥司巳置幹辦公事一員于雍州專切提舉左右江洞丁同措置買馬紹興三年置提舉買馬司于雍六年令帥臣兼領今雍州守臣提點買馬經幹一員置廨于雍者不廢也實掌買馬之財其下則有右江二提舉東提舉掌等量蠻馬兼收買馬印西提舉掌入蠻界招馬有同巡檢一員亦駐劄橫山寨候安撫上邉則率甲兵先往境上警護諸蕃入界有知寨主簿都監三員同主管買馬錢物産馬之國曰大理自把特磨羅殿毗那羅孔謝蕃膝蕃等每冬以馬叩邉買馬司先遣招馬官賫錦繒賜之馬將入境西提舉出境招之同巡檢率甲士往境上護之既入境自泗城州行六日至橫山寨雍守與經幹盛備以往與之互市蠻幕譙門而坐不與蠻接也東提舉乃與蠻首坐于庭上羣蠻與吾六校博易等量于庭下朝廷歲撥本路上供錢經制錢鹽鈔錢及廉州石康鹽成都府錦付經略司為市馬之費經司以諸色錢買銀及回易他州金錦綵帛盡往博易以馬之高下視銀之重輕鹽錦綵繒以銀定價歲額一千五百匹分為三十綱赴行在所紹興二十七年令馬綱分往江上諸軍後乞添綱令元額之外凡添買三十一綱蓋買三千五百匹矣此外又擇其權竒以入內廄不下十綱馬政之要大略見此宜州買馬馬産于大理國大理國去宜州十五程爾中有險阻不得而通故自把羅殿皆販馬于大理而轉賣于我者也羅殿甚邇於雍自把實隔逺焉自把之人強悍歲常以馬假道于羅殿而來羅殿難之故數致爭然自把雖逺於雍而乃邇於宜特隔南丹州而巳紹興三十一年自把與羅殿有爭乃由南丹徑驅馬直抵宜州城下宜人峻拒不去帥司為之量買三綱與之約曰後不許此來自是有獻言于朝宜州買馬良便下廣西帥臣議前後帥臣皆以宜州近內地不便本朝隄防外夷之意可為密矣高麗一水可至登萊必令自明州入貢者非故迂之也政不欲近耳今雍州橫山買馬諸蠻逺來入吾境內見吾邉面濶逺羈縻州數十為國藩蔽洞丁之強足以禦侮而橫山敻然逺在雍城七程之外置寨立關傍引左右江諸寨丁兵會合彈壓買馬官親帶甲士以臨之然後與之為市其形勢固如此今宜州之境虎頭關也距宜城不三百里一過虎關險阻九十里不可以放牧過此即是天河縣平易之地巳逼宜城矣此其可哉馬綱蠻馬入境自泗城州至橫山寨而止馬之來也涉地數千里瘠甚蠻縛其四足拽仆之啖鹽二斤許縱之旬日自肥矣官既買馬分定綱數經略司先下昭賀藤容高雷化欽廉宜栁融貴潯鬱林州差見任使臣三十三人前來橫山押馬不足聽募寄居待闕官常綱馬一綱五十匹進馬三十匹每綱押綱官一員將校五人醫獸一人牽馬兵士二十五人進馬綱則十五人蓋一人牽二馬也諸州差官兵既定押馬官借請贍家錢二百餘緡將校軍兵各有借請前往橫山寨提點買馬司公參既領綱則自橫山七程至雍州又十八程至經略司公參呈驗綱馬經略司覆量尺寸加以火印養之馬務以觀馬之羸壯體察押馬使臣之能否而進退之遂再分綱責領發往行在或江上諸軍交納沿路州縣皆有馬務為之宿程有口食券草料為人馬之須費既至朝廷又有賞罰以勸懲之凡全綱不死損者押綱官轉一官減三年磨勘死損三分者有降官之罰其餘賞罰有差將校軍兵各以所牽馬為賞罰賞則補以階級不願則請錢罰則加杖而遣之然而押馬亦有法焉其法買鹽留以自隨每日晚以鹽數兩啖之自然水草調而無疾此求全綱之法也大抵押馬乃武臣軍校速化之途而副尉纍以賞轉至正使者不可勝數雍州橫山寨博易場蠻馬之來他貨亦至蠻之所賫麝香胡羊長鳴雞披氊雲南刀及諸藥物吾商賈所賫錦繒豹皮文書及諸竒巧之物於是譯者平價交市招馬官乃私置場于家盡攬蠻市而輕其征其入官場者什才一二耳隆興甲申勝㢗子昭為雍守有智數多遣邏卒於私路口邀截商人越州輕其稅而留其貨為之品定諸貨之價列賈區於官場至開場之日羣商請貨于官依官所定價與蠻為市不許減價先售悉驅譯者導蠻恣買遇夜則次日再市其有不售許執覆監官減價博易諸商之事既畢官乃抽解併收稅錢賞信罰必官吏不敢乞取商亦無他縻費且無冒禁之險時雍州寬裕而人皆便之雍州永平寨博易場雍州右江永平寨與交址為境隔一澗耳其北有交址驛其南有宣和亭就為博易場永平知寨主管博易交人日以名香犀象金銀鹽錢與吾商易綾綿羅布而去凡來永平者皆洞落交人遵陸而來所賫必貴細唯鹽粗重然鹽止可易布爾以二十五斤為一籮布以雍州武緣縣所産狹幅者其人亦淳朴非若永安州交人至欽者之狡若右江又有湳江柵與交址蘇茂州為鄰亦時有少博易則湳江巡防主之欽州博易場凡交址生生之具悉仰于欽舟楫往來不絶也博易場在城外江東驛其以魚蚌來易斗米尺布者謂之交址蛋其國富商來博易者必自其邊永安州移牒于欽謂之小綱其國遣使來欽因以博易謂之大綱所賫乃金銀銅錢沉香光香熟香生香真珠象齒犀角吾之小商近販紙筆米布之屬日與交人少少博易亦無足言唯富商自蜀販錦至欽自欽易香至蜀歲一往返每博易動數千緡各以其貨互緘踰時而價始定既緘之後不得與他商議其始議價天地之不相侔吾之富商又日遣其徒為小商以自給而築室反耕以老之彼之富商頑然不動亦以持久困我二商相遇相與為杯酒歡久而降心相從儈者乃左右漸加抑揚其價相去不逺然後兩平焉官為之稱香交錦以成其事既博易官止收吾商之征其征之也約貨為錢多為虛數謂之綱錢每綱錢一千為實錢四百即以實錢一緡征三十焉交人本淳朴吾人詐之於權衡低昂之間其後至三遣使較定博易場稱邇年永安州人狡特甚吾商之詐彼也率以生藥之偽彼則以金銀雜以銅至不可辨香則漬以鹽使之能沉水或鑄鉛于香竅以沉之商人率墮其數中矣
