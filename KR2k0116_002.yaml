body:
  text: 嶺外代答卷二宋周去非撰外國門上安南國交址本秦象郡漢唐分置巳見於百粵故地首篇境內偽置四府十三州三寨府曰都護大通清化富良州曰永安永泰萬春豐道太平清化乂安遮風茶盧安豐蘇州茂州諒州寨曰和寧大盤新安大抵清化遮風乂安永安皆遵海而永安與欽州為境茶盧與占城為境蘇州茂州皆與雍管為境其國東西皆大海東有小江過海至欽亷西有陸路通白衣蠻南抵占城北抵雍管自欽西南舟行一日至其永安州由玉山大盤寨過永泰萬春即至其國都不過五日自雍州左江永平寨南行入其境機榔縣過烏皮桃花二小江至湳定江亦名富良江凡四日至其國都乃郭逹師所出也又自太平寨東南行過丹特羅江入其諒州六日至其國都若自右江溫潤寨入其國則迂矣交人自謂至其國都曰入洞謂吾民曰上京地里止此而文移動以數月蓋故為遷延以示道里之逺國初其部內亂有丁都領按宋史作部領者與其子璉率衆討平之衆立為帥三年而私命璉為節度使開寶六年璉遣使貢方物制以璉特進檢校太師充靜海軍節度觀察處置等使安南都護兼御史大夫上柱國濟隂郡開國公仍賜推誠順化功臣八年又封交址郡王璉死黎桓按原夲作亘避欽宗諱今依宋史改正篡立太平興國中桓以交州叛朝廷因以撫之桓死子至忠立大中祥符三年至忠卒有子才十嵗李公藴冒姓黎殺之自稱留後遣使請命授以黎氏官公藴死子德政立來告哀自稱留後天聖六年授安南都護交址郡王寶元初進南平王德政死子日尊立自稱大越國李氏第三帝日尊死子乾德立自號明王乾德初立權移臣下大臣李上吉首建叛議而廣西白州進士徐伯祥者有功于州不得官𨗳以犯邉陷雍欽廉三州朝廷遣郭逹致討幾覆其國乃以表乞降會王師大疫逹受表班師時熙寧八年也乾德死有遺腹子在占城奉而立之曰天祚按宋史紹興二年乾德卒子陽煥嗣八年陽煥卒子天祚嗣此有誤紹興二十六年入貢乾道癸已朝旨符廣西帥司下交址買馴象天祚因乞以象貢許之未入貢而天祚死嗣子龍不以聞而冒天祚名稱貢封為安南國王既受封乃以天祚名乞國印及上天祚遺表朝廷命廣西提刑廖蘧為使至欽州弔祭復立龍為安南國王其國僣偽自李日尊始偽諡其祖曰太祖神武自號曰大越國偽年曰天貺繼以十八字尊號乾德立乃犯邉朝廷遣郭逹為招撫使趙卨副之進至湳定江乾德奉表請降納之創為法制雖曰甚鄙而上下頗安之母妻皆稱后子皆稱太子本族稱大王族長稱承嗣餘族稱支嗣其官有內外職內職治國官之長曰輔國太尉猶宰相也外職治兵官之長曰樞密使金吾太尉都領兵其文移至邉有判安南都護府者亦外職也其入仕之途或任子或取士或以資有御龍武勝等八軍皆在左右每軍二百人橫刺字於額曰天子兵又有雄略勇健等九軍以充給使其宫室有水精宫天元殿制皆僭擬别有一樓榜曰安南都護府屋其國最重科舉凡入資先為吏敘遷至書狀又入資為保義郎即可為知州矣凡蒞官不支俸唯付以一方之民俾得屬役耕漁以取利兵士月一更暇則耕種自給嵗正月七日每一兵支錢三百紬絹布各一匹兵士月給禾十束元日以大禾飯魚鮓犒軍蓋其境土多占禾故以大禾為元日之犒正月四日國王宴官僚七月五日號大節人民相慶官僚以生口獻王王次日宴酬之門前有樓置大鐘為民訴寃為盜者斫手足指背國逃亡者斫手足謀叛者埋身露頭旁植徑竹挽竿繫首以利刃剗之首歘起揭竿標矣欽州探海往其部永安州投公文不容民間交語館之驛亭速遣出境防之甚密其國入貢自昔由雍或欽入境蓋先遣使議定移文經略司轉以上聞有旨許其來則專使上京不然則否舊制安南使者班在髙麗上建炎南渡李天祚乞入貢朝廷嘉其誠優詔答之紹興二十六年乞入貢許之乃遣使由欽入正使安南右武大夫李義嗣安南武翼郎郭應以五象充常進綱外更進升平綱以安南太平州刺史李國為使所獻方物甚盛表章皆金字貢金器凡一千二百餘兩以珠寶飾之者居半貢珍珠大者三顆如茄子次六顆如波羅密核次二十四顆如桃核次十七顆如李核次五十顆如棗核凡一百顆以金瓶盛之貢沉香一千斤翠羽五十隻深黃盤龍假子八百五十匹御馬六匹鞍轡副之常進馬八匹馴象五頭二綱衙官各五十人使者頗以所進盛多自矜後乞入貢朝廷輒却之乾道九年朝旨符廣西下安南買馴象天祚因乞以象貢許之以五象進奉大禮正使安南承議郎李邦正副安南忠翊郎阮文獻又以十象賀登寶位安南中衛大夫尹子思為使自雍州右江永平寨入象綱所過州縣類有宴犒夫腳象屋之費而諸郡兵衛單弱不足以聳外夷比至靜江見迓卒鎧甲之盛進退行伍之肅使者失聲嘆曰吾至此方見大朝威儀參府之次就戟門外上下馬庭參甚恭時范石湖為帥屬威嚴以臨之而盛其犒宴饋遺視紹興二十六年禮遇頗殺使者不敢較也帥司津遣入朝李邦正題詩郵亭有此去優成賜國名之句比到闕偶得賜國之寵使者滿意而歸過靜江復庭參致謝乞自欽州歸國許之比至欽留兩月其國以舟楫旗幟迓之而歸是役也貢象之外附貢金銀洗盤犀角象齒沉箋之屬計所直不滿二三萬緡似非紹興入貢之盛而其國掃府庫僅能集事朝廷賜豫優厚復叨異恩交使衙官百人所過州縣批劵得米以充糧食得錢則人日給十文餘皆藉歸國一路州縣應副夫腳八百人擎負貢物者固無幾而皆為使者負販至都象實能浮象奴所至水津索舟以載得錢然後驅以濟押伴官如加禮使者愈慢後不加禮乃聼命既僥幸賜國復有乞印之舉其後謝賜繼至欽又數乞入貢莫之許矣其國人烏衣黑齒椎髻徒跣無貴賤皆然其酋平居亦然但珥金簮上黃衫下紫裙耳其餘平居上衣則上緊蟠領皂衫四裙如背子名曰四顛下衣則皂裙也或珥鐵簮或曵皮履手執鶴羽扇頭戴螺笠其文身如銅鼓欵識其軍人橫刺字於額曰天子兵其婦人乃晳白異於男子皂裙男子之盡飾也以香膏沐髮如漆裹烏紗巾頂圓而小自額以上細褶如縫上徹於頂身著大蟠領皂衫加於小蟠領衫之上足加鞋襪遊於衢路與吾人無異但其巾可辨耳其來投文書也紫袍象笏趨拜雍容使者之來文武官皆紫袍紅鞓通犀帶無魚自貢象之後李邦正再使來欽乃加金魚甚長大其俗之轎如布囊而使者至欽則乘涼轎雨晴皆用之海外黎蠻海南有黎母山內為生黎去州縣逺不供賦役外為熟黎耕省地供賦役而各以所邇𨽻於四軍州黎質直獷悍不受欺觸本不為人患熟黎多湖廣福建之姦民也狡悍禍賊外雖供賦于官而隂結生黎以侵省地邀掠行旅居民官吏經由村洞多舍其家洞中有王二娘者黎之酋也夫之名不聞家饒於財善用其衆力能制服羣黎朝廷賜封宜人瓊管有令於黎洞必下王宜人無不帖然二娘死女亦能繼其業昔崇寧中王祖道經略廣西撫定黎賊九百七洞結丁口六萬四千開通道路一千二百餘里自以為漢唐以來所不臣之地皆入版圖官僚皆受厚賞淳熙元年五指山生黎洞首王仲期率其旁八十洞丁口一千八百二十人歸化諸洞首王仲文等八十一人詣瓊管公參就顯應廟研石歃血約誓改過不復抄掠瓊管犒遣歸洞大抵黎俗多猜客來不遽見之而於隙間察客儼然不動然後遣奴出布席客即席坐移時主乃出見一交一談少焉置酒先以惡穢味嘗客客忍食不疑則喜繼以牛酒否則遣客其親故聚會椎鼓歌舞三杯後請去備猶以弓刀置身側也性好讐殺謂之作拗遇親戚之仇即械繫之要牛酒銀瓶謂之贖命婚姻以折箭為信商旅在其家黎女有不潔者父母反對鄰里誇之其親死殺牛以祭不哭不飯唯食生牛肉其葬也舁櫬而行前一人以雞子擲地不破即吉地也居處皆柵屋土産名香檳榔椰子小馬翠羽黃蠟蘇朩吉貝之屬四州軍征商以為嵗計商賈多販牛以易香黎裝椎髻徒跣裸袒而腰繚吉貝首珥銀叉或銅或錫首或以絳帛綵帛包髻或帶小花笠或加雞尾而皆簪銀篦二枝亦有著短織花裙者熙寧中王祖道撫定黎洞其酋亦有補官今其孫尚服錦袍銀束帶蓋其先世所受賜而服之云猺人執黎弓垂箭筒戴兜鍪佩黎刀刀刃長二尺而柄甚長以白角片長尺許如雞尾為靶之飾兜鍪織藤為之其婦人髙髻繡面耳帶銅環垂墜至肩衣裙皆吉貝五色爛然無有袴襦徒繫裙數重裙製四圍合縫以足穿之而繫諸腰群浴于川黎人半能漢語十百為群變服入州縣墟市人莫辨焉日將晚或吹牛角為聲則紛紛聚會結隊而歸始知其為黎也海外諸蕃國諸蕃國大抵海為限界各因方隅而立國國有物宜各從都會以阜通正南諸國三佛齊其都會也東南諸國闍婆其都會也西南諸國浩乎不可窮近則占城真臘為窊裏諸國之都會逺則大秦為西天竺諸國之都會又其逺則麻離拔國為大食諸國之都會又其外則朩蘭皮國為極西諸國之都會三佛齊之南南大洋海也海中有嶼萬餘人莫居之愈南不可通矣闍婆之東東大洋海也水勢漸低女人國在焉愈東則尾閭之所泄非復人世稍東北向則髙麗百濟耳西南海上諸國不可勝計其大略亦可考姑以交址定其方隅直交址之南則占城真臘佛羅安也交址之西北則大理黑水吐蕃也於是西有大海隔之是海也名曰細蘭細蘭海中有一大洲名細蘭國渡之而西復有諸國其南為故臨國其北為大秦國王舍城天竺國又其西有海曰東大食海渡之而西則大食諸國也大食之地甚廣其國甚多不可悉載又其西有海名西大食海渡之而西則朩蘭皮諸國凡千餘更西則日之所入不得而聞也占城國占城漢林邑也境上有馬援銅柱在唐曰環王王所居曰占城以名其國地産名香犀象土皆白砂可耕之地絶少無羊豕𬞞茹人採香為生國無市肆地廣人少多買奴婢舶舟以人為貨北抵交址南抵真臘臣事交址而日與真臘為仇乾道癸已閩人有以西班到選得官吉陽軍都監者泛海之官飄至占城見其國與真臘乘象以戰無大勝負乃説王以騎戰之利教之弓弩騎射占城王大悅具舟送至吉陽厚賫隨以買馬得數十匹以戰則克次年復來人徒甚盛吉陽軍因却以無馬乃轉之瓊管瓊管不受遂怒而歸後不復至也異時諸國舶舟類為其所虜蓋其俗本好剽掠其屬有賓瞳朧國賔陀陵國目連舍基在賔陀陵或云即王舍城建隆二年曽貢方物三年八月又來貢哲宗元祐元年十二月又進貢有詔賜錢二千六百緡其慕化抑可嘉也真臘國真臘國逺於占城而近於諸蕃其旁有窊裏國西棚國三泊國麻蘭國登流眉國第辣撻國真臘為之都會北抵占城最産名香登流眉所産為絶竒諸蕃國香所不及也其國僧道呪法靈甚僧之黃衣者有室家紅衣者寺居戒律精嚴道士以朩葉為衣國中望天一隅常有少痕其人云昔女媧所不至也本朝徽宗宣和二年曽遣使入貢蒲甘國蒲甘國自大理國五程至其國自窊裏國六十程至之隔黑水淤泥河則西天諸國不可通矣蒲甘國王官貟皆戴金冠狀如犀角有馬不鞍而騎王居以錫為瓦以金銀裹飾屋壁有寺數十所僧皆黃衣國王早朝其官僚各持花獻王僧作梵語祝夀以花戴王首餘花歸寺供佛徽宗崇寧五年二月曽入貢三佛齊國三佛齊國在南海之中諸蕃水道之要衝也東自闍婆諸國西自大食故臨諸國無不由其境而入中國者國無所産而人習戰攻服藥在身刃不能傷陸攻水戰奮擊無前以故鄰國咸服焉蕃舶過境有不入其國者必出師盡殺之以故其國富犀象珠璣香藥其俗縛排浮水而居其屬有佛羅安國國主自三佛齊選差地亦産香氣味腥烈較之下岸諸國此為差勝有聖佛三佛齊國主再嵗一往燒香藝祖開基建隆元年九月三佛齊王悉利大霞里壇按宋史悉利下有胡字遣使來貢方物二年五月復遣使進貢三年三月又來貢十二月又貢方物至神宗元豐二年七月遣詹卑國使來貢哲宗元祐三年閏十二月又遣使入貢五月復來貢慕義來庭與他國不侔矣闍婆國闍婆國又名莆家龍在海東南勢下故曰下岸廣州自十一月十二月發舶順風連昏旦一月可到國王撮髻腦後人民剃頭留短髮好以花樣縵布繳身以椰子并撻樹漿為酒蔗糖其色紅白味極甘美以銷銀鍮錫雜鑄為錢其錢以六十箇準為一兩金用三十二錢為半兩金土産胡椒檀香丁香白豆䓻肉豆䓻沉香國人尚氣好鬪戰王及官豪有死者左右承奉人皆願隨死焚則躍入火中棄骨於水亦踣水溺死不悔故臨國故臨國與大食國相邇廣舶四十日到藍里住冬次年再發船約一月始逹其國人黑色身纒白布鬚髮伸直露頭撮髻穿紅皮履如畫羅漢腳踏者好事弓箭遇鬪戰敵時以綵纈纒髻國王身纒布出入以布作軟兜或乘象國人好奉事佛其國有大食國蕃客寄居甚多每洗浴畢用鬱金塗身欲象佛之金身也監篦國遞年販象牛大食販馬前來此國貨賣國王事天尊牛殺之償死中國舶商欲往大食必自故臨易小舟而往雖以一月南風至之然往返經二年矣注輦國注輦國是西天南印度也欲往其國當自故臨國易舟而行或云蒲甘國亦可往其國王冠有明珠異寶多與西天諸國戰爭國有戰象六萬皆髙七八尺戰時象背立屋載勇士逺則用箭近則用槊戰勝者象亦賜號以旌其功至有賜錦帳金槽者每日象亦朝王國王及官民皆撮髻繞白布以金銀為錢出指環腦子蓋貓兒睛之類也真珠象牙雜色琥珀色絲布妓女近萬家每日輪妓三千入朝祗役國人尚氣輕生有不相伏者日數十對在王前用短刀格鬪死而無悔父子兄弟不同釡而爨不共器而食然甚重義真宗大中祥符八年注輦國王遣使貢真珠等譯者道其言曰願以表逺人慕化之心至神宗熙寧十年六月此國亦貢方物上遣內侍勞問之乃此國也
