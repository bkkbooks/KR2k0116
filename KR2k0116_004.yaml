body:
  text: 嶺外代答卷四宋周去非撰風土門廣右風氣南人有言曰雨下便寒晴便熱不論春夏與秋冬此語盡南方之風氣矣桂林氣候與江浙頗相類過桂林城南數十里則便大異杜子美謂宜人獨桂林得之矣欽陽雨則寒氣淅淅襲人晴則溫氣勃勃蒸人陰濕晦冥一日數變得頃刻明快又復陰合冬月久晴不離葛衣紈扇夏月苦雨急須襲被重裘大抵早溫晝熱晚涼夜寒一日而四時之氣備九月梅花盛開臘夜己食青梅初春百卉蔭密楓槐榆桞四時常青草朩雖大易以蠧腐五榖濕而不甘六畜淡而無味水泉腥而黯慘蔬茹瘦而苦硬人生其間率皆半羸而不耐苦作生齒不蕃土曠人稀皆風氣使然也北人至其地莫若少食而頻餐多衣而屢更惟酒與色不可嗜也如是則庶免乎瘴然而腑臟日與惡弱水土接毒氣浸淫終當一疾但有淺深耳久則與之俱化雪雹杜子美詩五嶺皆炎熱宜人獨桂林梅花萬里外雪片一冬深蓋桂林嘗有雪稍南則無之他州土人皆莫知雪為何形欽之父老云數十年前冬常有雪歲乃大災蓋南方地氣常燠草朩柔脆一或有雪則萬朩殭死明歲土膏不興春不發生正為災雪非瑞雪也若春夏有雹歲乃大熟蓋春夏熱氣能抑之反得和平而百物倍收非若中土春夏遇雹而陽氣微也天地之間氣異乃爾瘴地嶺外毒瘴不必深廣之地如海南之瓊管海北之廉雷化雖曰深廣而瘴乃稍輕昭州與湖南靜江接境士夫指以為大法場言殺人之多也若深廣之地如橫雍欽貴其瘴殆與昭等獨不知小法場之名在何州嘗謂瘴重之州率水土毒爾非天時也昭州有恭城江水並城而出其色黯慘江石皆黑橫雍欽貴皆無石井唯欽江水有一泉乃土泉非石泉也而地産毒藥其類不一安得無水毒乎瘴疾之作亦有運氣如中州之疫然大槩水毒之地必深廣廣東以新州為大法場英州為小法場因併存之瘴挑草子附南方凡病皆謂之瘴其實似中州傷寒蓋天氣鬱蒸陽多宣泄冬不閉藏草朩水泉皆稟惡氣人生其間日受其毒元氣不固發為瘴疾輕者寒熱往來正類痁瘧謂之冷瘴重者純熱無寒更重者藴熱沉沉無晝無夜如卧灰火謂之熱瘴最重者一病則失音莫知所以然謂之啞瘴冷瘴未必死熱瘴久必死啞瘴治得其道間亦可生冷瘴以瘧治熱瘴以傷寒治啞瘴以失音傷寒治雖未可收十全之功往往愈者過半治瘴不可純用中州傷寒之藥茍徒見其熱甚而以朴硝大黃之類下之茍所稟怯弱立見傾危昔靜江府唐侍御家仙者授以青蒿散至今南方瘴疾服之有奇驗其藥用青蒿石膏及草藥服之而不愈者是其人稟弱而病深也急以附子丹砂救之往往多愈夫南方盛熱而服丹砂非以熱益熱也蓋陽氣不固假熱藥以收拾之爾痛哉深廣不知醫藥唯知設鬼而坐致殂殞間有南人熱瘴挑草子而愈者南人熱瘴發一二日以針刺其上下唇其法捲唇之裏刺其正中以手捻去唇血又以楮葉擦舌又令病人並足而立刺兩足後腕橫縫中青脈血出如注乃以青蒿和水服之應手而愈冷瘴與雜病不可刺矣熱瘴乃太陽傷寒證刺出其血是亦得汗法耳人之上下唇是陽明胃脈之所經足後腕是太陽膀胱脈之所經太陽受病三日而陽明受病南人之針可以暗合矣有發瘴過經病己入裏而濱死刺病人隂莖而愈竊意其內通五臟故或可以愈也然施於壯健尚可施於怯弱者豈不危哉屋室廣西諸郡富家大室覆之以瓦不施棧板唯敷瓦于椽間仰視見瓦徒取其不藏鼠日光穿漏不以為厭也小民壘土墼為墻而架宇其上全不施柱或以竹仰覆為瓦或但織竹笆兩重任其漏滴廣中居民四壁不加塗泥夜間焚膏其光四出于外故有一家點火十家光之譏原其所以然蓋其地暖利在通風不利堙窒也未嘗見其茅屋然則廣人雖于茅亦以為勞事巢居深廣之民結柵以居上設茅屋下豢牛豕柵上編竹為棧不施椅桌牀榻唯有一牛皮為裀席寢食於斯牛豕之穢升聞于棧罅之間不可向邇彼皆習慣莫之聞也考其所以然蓋地多虎狼不如是則人畜皆不得無乃上古巢居之意歟踏犂靜江民頗力于田其耕也先施人工踏犂乃以牛平之踏犂形如匙長六尺許末施橫朩一尺餘此兩手所捉處也犂柄之中於其左邊施短柄焉此左腳所踏處也踏可耕三尺則釋左腳而以兩手翻泥謂之一進迤邐而前泥壠悉成行列不異牛耕子嘗料之踏犂五日可當牛犂一日又不若牛犂之深於土問之乃惜牛耳牛自深廣來不耐苦作桂人養之不得其道任其放牧未嘗餵飼夏則放之水中冬則藏之岩穴初無欄屋以禦風雨今浙人養牛冬月密閉其欄重藁以藉之暖日可愛則牽出就日去穢而加新又日取新草于山唯恐其一不飯也浙牛所以勤苦而永年者非特天産之良人為之助亦多矣南中養牛若此安得而長用之哉若夫無牛之處則踏犂之法胡可廢也又廣人荆棘費鋤之地三人二踏犂夾掘一穴方可五尺宿根巨梗無不翻舉甚易為功此法不可以不存樁堂靜江民間穫禾取禾心一莖藳連穗收之謂之清冷禾屋角為大朩槽將食時取禾樁於槽中其聲如僧寺之朩魚女伴以意運杵成音韻名曰樁堂每旦及日昃則樁堂之聲四聞可聽送老嶺南嫁女之夕新人盛飾廟坐女伴亦盛飾夾輔之迭相歌和含情悽惋各致殷勤名曰送老言將别年少之伴道之偕老也其歌也靜江人倚蘇幕遮為聲欽人倚人月圎皆臨機自撰不肯蹈襲其間乃有絶佳者凡送老皆在深夜鄉黨男子羣往觀之或於稠人中發歌以調女伴女伴知其謂誰亦歌以答之頗竊中其家之隱慝往往以此致爭亦或以此心許方言方言古人有之乃若廣西之蔞語如稱官為溝主母為米囊外祖母為低僕使曰齋捽喫飯為報崖若此之類當待譯而後通至城郭居民語乃平易自福建湖湘皆不及也其間所言意義頗善有非中州所可及也早曰朝時晚曰晡時以竹器盛飯如篋曰簞以瓦瓶盛水曰罌相交曰契交自稱曰寒賤長於我稱之曰老兄少於我稱之曰老弟丈人行呼其少曰老姪呼至少者曰孫泛呼孩提曰細子謂慵惰為不事産業謂人讐記曰彼期待我力作而手倦曰指窮困貧無力曰力匱令人先行曰行前水落曰水尾殺泊舟曰埋船頭離岸曰皮船頭舟行曰船在水皮上大腳脛犬曰大蟲腳若此之類亦云雅矣余又嘗令譯者以禮部韻按交址語字字有異唯花字不須譯又謂北為朔因併志之俗字廣西俗字甚多如音矮言矮則不長也音穩言大坐則穩也音動言瘦弱也音終言死也音臘言不能舉足也仦音嫋言小兒也徒架切言姊也閂音􅗚言門橫關也􅲢音磡言岩崖也氽音泅言人在水上也溺音魅言沒人在水下也􆆄音鬍言多髭東敢切言以石擊水之聲也大理國間有文書至南邊猶用此圀字圀武后所作國字也法制門奏辟廣西奏辟不限資格唯材是求自守闕副尉下班之類一經奏辟皆得領兵民之寄大率初辟巡尉知寨次辟沿邊知縣都監次可辟左右江提舉等而上之沿邊知州軍皆可辟也守倅舊許帥司奏辟今多與監司聮銜具奏帥司又可專辟沿邊州軍主兵官前官將替半年便許量材選辟辟書一上便可就權往往非注補官之人皆由之而並進俟成命之下就權年月皆理為在任不成則不過解職而去耳誠仕宦速化之地比之吏部格法何啻霄壤也定擬廣西去朝廷遠士夫難以一一到部令漕司奉行吏部銓法謂之南選諸郡之闕吏部以入殘零一月無人注授却發下漕司定擬待次士夫擬得一闕先許就權吏部考其格法無害則給告劄付之理前月日為任南中士夫甚樂之廣西經任人多不欲注曹官唯欲授破格職官初任人不欲授監當簿尉唯欲授破格曹官謂如吏部注中州四選闕率一官而四人共之唯廣西闕無人注授及發下定擬唯許寄居隨侍曾任本路人參選員少闕多率是見次選人於此可養資考豈吏部注擬之所常有者故落南士夫多不出嶺良以此也試場二廣試場有三曰科舉曰銓試曰攝試今銓試廢矣唯攝試科舉而己嶺外科舉尤重於中州蓋有攝官一門存焉始也攝官屬漕司廣西於靜江開場試斷案五世之大法家按宋史淳熙中祕書郎李巘請令習大法者兼習經義詔自今第一第二第三場試斷案第四場經義第五場刑統律義世試音同疑傳寫之誤以闕員為額差靜江法司人吏祇應斷案未免或出其手科舉考官有出身人不足許差恩榜人赴試者少而解額頗寬雖左右江溪洞亦有解額二名諸州得解士人俟再得舉則試攝為假版官唯靜江士子不屑就焉故數有登科者攝官二廣兩得解士人許赴漕司試攝以闕員為額綴名者漕司給公據服緑參南選出而蒞民矣今律所謂假版官是也攝官有三等一待次攝官二正額攝官三解發攝官待次歷兩任無過漕司再給公據印紙為正額又兩任無過漕司解發吏部補迪功郎自是通行仕路矣當其未補真命也歷任之中有犯贓私該徒流罪猶加真刑逮入階官乃作經任人注擬佳闕六考以舉狀改官夫二廣士子少年得舉即可補攝數年而受真命見次厚賞資歷易深升改甚捷有官至正郎任數子者大率以荒僻海邦監當簿尉令存留為攝官闕吏部又收其闕之稍厚者以注命官始以五十員為額今減為三十員無復往時之速化矣二廣士夫苟能克己自奮又何藉於假版聞昔有賀州楊攝官者始參南選隨例見於銓吏吏不加禮楊怒拔手版擊吏取緑衣攝帖焚之而去次年乃登科所在稱職使攝官者如之奚患二廣風俗士氣之不振南海役法自免役法行天下無復有鄉差為吏之州獨海南四郡不行焉聞仕於海南者曰海南名為鄉差實募人為吏彼受募者己世其業民間反謂免役為便願輸役錢而不可得夫權利之心人皆有之地邇京師則人以功名為權利去朝廷遠人絶榮望人知吏之為權利耳廣西州縣之吏皆鄉落大姓能為一鄉之禍福人莫不尊敬之與江浙之恥為吏者大異遠方之貴吏猶江浙之貴仕也况南海之遠乎向之所知殆一二受募吏輩自固之言嘗謂免役之法聖人所謂順非而澤者也人生天地之間生於憂患而死於安樂富民為吏豈不艱苦然而甲乙執役必能自愛其鄉黨雖不保其不為非必不至舞文以毒民如今日之吏就使斯民得輸錢免役以自逸而心厭作吏之賤舉先王良法美意納之於斯民厭惡之心俾募雇為吏者長子孫於害民之間而斯民有無窮之患豈不甚可痛哉自免役之法一行有志於世之士至終不敢復蓋民之所安者在是聖人所謂順非而澤者其是法乎鄉差之法非役民以自養也與民長慮而全其生也今日舉世之民受吏之害幸海南四郡遺法尚存吾懼繼此有搖撼欲去之而行免役者羊亡禮遂亡矣常平常平米斛見存無幾所在皆是也廣右諸郡唯靜江常平米止支諸司人吏俸米自餘諸郡不以軍糧不足借支不還則以久不賑發腐損耗失軍糧不足而借支所至皆然非獨廣右且廣西米斗五十錢榖賤莫甚焉夫其賤非誠多榖也正以生齒不蕃食榖不多耳田家自給之外餘悉糶去曾無久遠之積富商以下價糴之而舳艫銜尾運之番禺以罔市利名曰榖賤其實無積貯爾州郡久不賑發一連遇大凶年米斗僅至二百錢則人民已有流離之禍州縣拱手無策以處之然則榖賤之果不足恃也如此若夫以新易陳在州郡所得為之事曰斂曰散曷不於樂歲廣糴以為之備乎
